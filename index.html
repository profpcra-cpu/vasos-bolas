<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ball Sort Aurora">
<meta name="theme-color" content="#0B0614">
<title>Ball Sort Aurora</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AURORA DESIGN SYSTEM
   ============================================================ */
:root{
  /* Backgrounds — quase-preto com nuance violeta */
  --bg-deep:#0B0614;
  --bg-mid:#150B26;
  --bg-soft:#1F1235;
  --bg-glass:rgba(255,255,255,.035);
  --bg-glass-hover:rgba(255,255,255,.07);

  /* Texto */
  --text:#F2EEF9;
  --text-muted:#B8A8D6;
  --text-dim:#6E5E8E;

  /* Bordas */
  --border-soft:rgba(255,255,255,.08);
  --border-lit:rgba(255,255,255,.16);

  /* Vidro */
  --glass-blur:blur(14px) saturate(1.4);
  --glass-blur-strong:blur(22px) saturate(1.6);

  /* Acentos */
  --accent-coral:#E85D5D;
  --accent-menta:#5DE8A8;
  --accent-mustard:#E8D45D;
  --accent-violet:#9B5DE8;
  --accent-sky:#5DB8E8;
  --accent-glow:0 0 32px rgba(155,93,232,.45);
  --accent-glow-strong:0 0 40px rgba(155,93,232,.75);

  /* Sombras */
  --shadow-soft:0 2px 8px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);

  /* Motion */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:.16s var(--ease-out);
  --t-base:.28s var(--ease-out);
  --t-slow:.5s var(--ease-out);

  /* Radii */
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;

  /* Sizing */
  --bw:30px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

[data-theme="light"]{
  --bg-deep:#F5F1FA;
  --bg-mid:#EDE6F5;
  --bg-soft:#FFFFFF;
  --bg-glass:rgba(30,20,60,.04);
  --bg-glass-hover:rgba(30,20,60,.08);
  --text:#1A0B2E;
  --text-muted:#6B5B8A;
  --text-dim:#A89BC4;
  --border-soft:rgba(30,20,60,.1);
  --border-lit:rgba(30,20,60,.18);
  --shadow-soft:0 2px 8px rgba(30,20,60,.08);
  --shadow-md:0 8px 24px rgba(30,20,60,.12);
  --shadow-lg:0 20px 60px rgba(30,20,60,.18);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  color:var(--text);
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent-violet);outline-offset:4px;border-radius:var(--r-sm)}

body{
  background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--bg-mid) 0%,var(--bg-deep) 60%);
  display:flex; flex-direction:column;
  min-height:100dvh;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
  transition:background var(--t-slow);
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(155,93,232,.08),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(93,184,232,.06),transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(232,93,93,.03),transparent 60%);
}
body.zen-mode::before{opacity:.4}

/* ============================================================
   TOP HUD — só informação (nada clicável exceto Zen exit)
   ============================================================ */
.hud{
  position:relative; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 6px;
  gap:12px;
}
.hud-left{display:flex; flex-direction:column; gap:1px; min-width:0}
.hud-level{font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-dim)}
.hud-title{font-size:18px; font-weight:800; letter-spacing:-.3px; line-height:1}
.hud-title .accent{color:var(--accent-violet)}

.hud-center{display:flex; gap:8px; align-items:center}
.hud-pill{
  display:flex; align-items:center; gap:5px;
  padding:6px 12px;
  background:var(--bg-glass);
  border:1px solid var(--border-soft);
  border-radius:var(--r-full);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  font-size:12px; font-weight:700;
  font-variant-numeric:tabular-nums;
  color:var(--text);
  transition:all var(--t-base);
}
.hud-pill .icon{font-size:11px; opacity:.7}
.hud-pill.highlight{
  border-color:rgba(93,232,168,.4);
  background:rgba(93,232,168,.08);
  box-shadow:0 0 16px rgba(93,232,168,.2);
}

.hud-right{display:flex; gap:6px; align-items:center}
.hud-btn{
  width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-glass);
  border:1px solid var(--border-soft);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  font-size:15px;
  transition:all var(--t-base);
  color:var(--text);
}
.hud-btn:hover{background:var(--bg-glass-hover); transform:translateY(-1px)}
.hud-btn:active{transform:scale(.94)}
.hud-btn[hidden]{display:none}

/* ============================================================
   BOARD
   ============================================================ */
.board-area{
  flex:1;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:16px 12px;
  overflow:hidden;
  min-height:0;
  position:relative; z-index:1;
  transition:opacity var(--t-slow), transform var(--t-slow);
}
.board-area.fade-out{opacity:0; transform:scale(.96); pointer-events:none}

.tubes-container{
  display:flex; flex-wrap:wrap;
  gap:14px 10px;
  max-width:100%; width:100%;
  justify-content:center; align-items:flex-end;
}

/* ============================================================
   TUBES — vidro fosco com refração
   ============================================================ */
.tube{
  position:relative;
  width:var(--tw,44px);
  height:var(--th,180px);
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.10) 0%,
      rgba(255,255,255,.03) 20%,
      rgba(255,255,255,.02) 80%,
      rgba(255,255,255,.06) 100%);
  border-radius:0 0 22px 22px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -1px 0 rgba(255,255,255,.12),
    inset -2px 0 6px rgba(0,0,0,.15),
    inset 2px 0 6px rgba(255,255,255,.08),
    0 4px 16px rgba(0,0,0,.25);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  display:flex; flex-direction:column-reverse; align-items:center;
  padding:5px 5px 0;
  cursor:pointer;
  transition:transform var(--t-base), filter var(--t-base), box-shadow var(--t-base);
  overflow:visible;
  isolation:isolate;
}
/* Borda que "pega luz" — só aparece nas laterais superiores */
.tube::before{
  content:''; position:absolute; inset:0;
  border-radius:0 0 22px 22px;
  border:1.5px solid transparent;
  border-bottom-color:rgba(255,255,255,.35);
  border-left-color:rgba(255,255,255,.14);
  border-right-color:rgba(255,255,255,.06);
  pointer-events:none; z-index:3;
  mask:linear-gradient(180deg,transparent 0%,black 15%,black 100%);
  -webkit-mask:linear-gradient(180deg,transparent 0%,black 15%,black 100%);
}
/* Reflexo interno superior — a "luz" que entra */
.tube::after{
  content:''; position:absolute;
  top:2px; left:14%; right:14%; height:35%;
  background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);
  border-radius:50% 50% 40% 40%/30% 30% 20% 20%;
  pointer-events:none; z-index:2; opacity:.55;
  filter:blur(1px);
}

.tube:not(.complete):not(.selected):hover{transform:translateY(-4px)}
.tube.selected{
  transform:translateY(-12px) scale(1.02);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -1px 0 rgba(255,255,255,.15),
    0 4px 16px rgba(0,0,0,.3),
    0 0 32px rgba(155,93,232,.55),
    0 0 60px rgba(155,93,232,.25);
}
.tube.destination::before{
  border-color:rgba(93,232,168,.7);
  box-shadow:inset 0 0 20px rgba(93,232,168,.15);
}
.tube.destination{box-shadow:
  inset 0 1px 0 rgba(255,255,255,.25),
  0 0 28px rgba(93,232,168,.4);
}

.tube.complete::before{
  border-bottom-color:rgba(93,232,168,.9);
  border-left-color:rgba(93,232,168,.4);
  border-right-color:rgba(93,232,168,.4);
}
.tube.complete{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    0 0 24px rgba(93,232,168,.35),
    0 4px 16px rgba(0,0,0,.25);
}
.tube.complete::after{
  content:''; position:absolute; inset:0; border-radius:0 0 22px 22px;
  background:linear-gradient(180deg,transparent 0%,rgba(93,232,168,.12) 100%);
  pointer-events:none; z-index:0;
  animation:completeGlow 1.6s var(--ease-out);
}
@keyframes completeGlow{
  0%{opacity:1}
  100%{opacity:.35}
}

.tube.invalid{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px) rotate(-1deg)}
  40%{transform:translateX(6px) rotate(1deg)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}

.tube.hint{
  animation:hintBounce .7s var(--ease-spring) 2;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    0 0 32px rgba(232,212,93,.6),
    0 0 60px rgba(232,212,93,.3);
}
@keyframes hintBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* Tubo com limite de movimentos — anel ao redor */
.tube.has-limit{
  outline:2px solid rgba(232,93,93,.5);
  outline-offset:3px;
}
.tube-limit-badge{
  position:absolute;
  top:-10px; right:-8px;
  min-width:20px; height:20px;
  padding:0 5px;
  border-radius:var(--r-full);
  background:linear-gradient(135deg,#E85D5D,#C73A3A);
  color:#fff;
  font-size:10px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(232,93,93,.6);
  z-index:6;
  font-variant-numeric:tabular-nums;
}
.tube.has-limit.tube-locked .tube-limit-badge{background:linear-gradient(135deg,#555,#333); box-shadow:none}
.tube.tube-locked{opacity:.55; cursor:not-allowed}
.tube.tube-locked::before{border-color:rgba(255,255,255,.06)}

/* ============================================================
   BALLS — material soft-touch
   ============================================================ */
.ball{
  width:var(--bw,30px); height:var(--bw,30px);
  border-radius:50%;
  margin-bottom:3px;
  position:relative;
  flex-shrink:0;
  /* sombra direcional (luz do topo-esquerda) */
  box-shadow:
    inset -1px -2px 3px rgba(0,0,0,.22),
    inset 1px 2px 4px rgba(255,255,255,.28),
    0 2px 4px rgba(0,0,0,.3);
  transition:transform var(--t-base), box-shadow var(--t-base);
}
/* Highlight elíptico (luz de estúdio, não bolinha) */
.ball::before{
  content:''; position:absolute;
  top:8%; left:16%; width:52%; height:38%;
  border-radius:50%;
  background:radial-gradient(ellipse at 40% 35%,
    rgba(255,255,255,.85) 0%,
    rgba(255,255,255,.4) 40%,
    transparent 75%);
  pointer-events:none;
  filter:blur(.5px);
}
/* Borda de "película" de vidro — arco fino na base */
.ball::after{
  content:''; position:absolute;
  bottom:6%; left:18%; right:18%; height:10%;
  border-radius:50%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  opacity:.4;
  pointer-events:none;
}

.ball.animated{animation:ballDrop .32s var(--ease-spring)}
@keyframes ballDrop{
  0%{transform:translateY(-20px) scale(.7); opacity:0}
  60%{transform:translateY(2px) scale(1.06); opacity:1}
  100%{transform:translateY(0) scale(1); opacity:1}
}

/* Paleta Aurora — cores curadas */
.ball.coral    { background:linear-gradient(160deg,#F27A7A,#E85D5D 55%,#C73A3A); }
.ball.menta    { background:linear-gradient(160deg,#7FEBC0,#5DE8A8 55%,#2EB87A); }
.ball.mustard  { background:linear-gradient(160deg,#F0E180,#E8D45D 55%,#C2A823); }
.ball.violet   { background:linear-gradient(160deg,#B784F0,#9B5DE8 55%,#7433C7); }
.ball.sky      { background:linear-gradient(160deg,#7FCCEE,#5DB8E8 55%,#2E85C2); }
.ball.peach    { background:linear-gradient(160deg,#F0A576,#E8824D 55%,#C26327); }
.ball.lilac    { background:linear-gradient(160deg,#D9AEEF,#C583E5 55%,#9E53C7); }
.ball.aqua     { background:linear-gradient(160deg,#7FEEE2,#5DE8D8 55%,#2EC2B0); }
.ball.rose     { background:linear-gradient(160deg,#F09FBF,#E86D9E 55%,#C73A72); }
.ball.sage     { background:linear-gradient(160deg,#AFD89F,#7FBF6D 55%,#4E8F3E); }
.ball.sand     { background:linear-gradient(160deg,#E5CFA8,#C9A876 55%,#9E7F4A); }
.ball.slate    { background:linear-gradient(160deg,#A3ABC0,#6E7896 55%,#454D66); }
.ball.plum     { background:linear-gradient(160deg,#C77EA8,#9E4D7A 55%,#752E52); }

/* Rainbow — bicolor restrito (usado apenas como curinga condicional) */
.ball.rainbow{
  background:conic-gradient(from 0deg,#E85D5D,#E8D45D,#5DE8A8,#5DB8E8,#9B5DE8,#E86D9E,#E85D5D);
  animation:rainbowSpin 6s linear infinite;
}
@keyframes rainbowSpin{to{filter:hue-rotate(360deg)}}

/* Blind — bola mistério */
.ball.blind{
  background:linear-gradient(160deg,#3A2E52,#1F1235 55%,#0B0614);
}
.ball.blind::before{background:radial-gradient(ellipse at 40% 35%,rgba(232,212,93,.6),transparent 60%)}
.ball.blind::after{
  content:'?';
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  color:#E8D45D; font-weight:900; font-size:calc(var(--bw) * .48);
  background:transparent;
  border-radius:0;
  opacity:1;
  text-shadow:0 0 8px rgba(232,212,93,.6);
}

/* ============================================================
   BOTTOM DOCK — todos os controles
   ============================================================ */
.dock{
  position:relative; z-index:20;
  padding:10px 16px calc(10px + var(--safe-bottom));
  background:linear-gradient(180deg,transparent 0%,rgba(11,6,20,.85) 40%);
  display:flex; justify-content:center;
}
.dock-inner{
  display:flex; gap:6px; align-items:center;
  padding:8px 10px;
  background:var(--bg-glass);
  border:1px solid var(--border-soft);
  border-radius:var(--r-full);
  backdrop-filter:var(--glass-blur-strong);
  -webkit-backdrop-filter:var(--glass-blur-strong);
  box-shadow:var(--shadow-md);
}
.dock-btn{
  position:relative;
  width:46px; height:46px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
  background:transparent;
  color:var(--text);
  transition:all var(--t-base);
}
.dock-btn:hover:not(:disabled){
  background:var(--bg-glass-hover);
  transform:translateY(-2px);
}
.dock-btn:active:not(:disabled){transform:scale(.92)}
.dock-btn:disabled{opacity:.3; cursor:not-allowed}
.dock-btn.primary{
  background:linear-gradient(135deg,var(--accent-violet),#7433C7);
  box-shadow:0 4px 16px rgba(155,93,232,.4);
}
.dock-btn.primary:hover:not(:disabled){
  box-shadow:0 6px 22px rgba(155,93,232,.6);
}
.dock-btn.active{
  background:rgba(93,232,168,.18);
  color:var(--accent-menta);
  box-shadow:0 0 16px rgba(93,232,168,.3);
}
.dock-btn .badge{
  position:absolute; top:2px; right:2px;
  min-width:16px; height:16px;
  padding:0 4px;
  border-radius:var(--r-full);
  background:var(--accent-coral);
  color:#fff;
  font-size:9px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}

/* ============================================================
   MODAL (win + settings)
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; z-index:1000;
  background:rgba(11,6,20,.72);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  opacity:0; pointer-events:none;
  transition:opacity var(--t-base);
}
.modal-overlay.active{opacity:1; pointer-events:auto}

.modal-card{
  background:linear-gradient(160deg,rgba(31,18,53,.98),rgba(21,11,38,.98));
  border:1px solid var(--border-lit);
  border-radius:var(--r-xl);
  padding:28px 24px;
  max-width:380px; width:100%;
  text-align:center;
  box-shadow:var(--shadow-lg);
  transform:scale(.92) translateY(10px);
  transition:transform var(--t-slow);
}
.modal-overlay.active .modal-card{transform:scale(1) translateY(0)}

.modal-emoji{font-size:52px; margin-bottom:10px; line-height:1}
.modal-title{
  font-size:22px; font-weight:800;
  margin:0 0 6px;
  background:linear-gradient(135deg,var(--accent-violet),var(--accent-sky));
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-.4px;
}
.modal-message{color:var(--text-muted); font-size:13px; margin:0 0 18px; line-height:1.5}

.modal-stats{
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:14px;
  background:var(--bg-glass);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  margin-bottom:18px;
}
.modal-stat-value{
  font-size:20px; font-weight:800;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}
.modal-stat-label{
  font-size:9px; text-transform:uppercase; letter-spacing:1px;
  color:var(--text-dim); font-weight:700;
  margin-top:2px;
}

.modal-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-full);
  background:linear-gradient(135deg,var(--accent-violet),#7433C7);
  color:#fff; font-size:14px; font-weight:800;
  box-shadow:0 6px 20px rgba(155,93,232,.45);
  transition:all var(--t-base);
  letter-spacing:.2px;
}
.modal-btn:hover{transform:translateY(-2px); box-shadow:0 8px 28px rgba(155,93,232,.65)}
.modal-btn:active{transform:translateY(0) scale(.98)}
.modal-btn.secondary{
  background:var(--bg-glass);
  border:1px solid var(--border-soft);
  color:var(--text);
  box-shadow:none;
  margin-top:8px;
}

/* Settings rows */
.settings-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 4px;
  border-bottom:1px solid var(--border-soft);
  text-align:left;
}
.settings-row:last-of-type{border-bottom:none}
.settings-label{font-size:13px; font-weight:600; color:var(--text)}
.settings-sublabel{font-size:11px; color:var(--text-dim); margin-top:2px}
.settings-toggle{
  width:44px; height:26px; border-radius:var(--r-full);
  background:var(--bg-glass); border:1px solid var(--border-soft);
  position:relative; transition:all var(--t-base);
}
.settings-toggle::after{
  content:''; position:absolute;
  top:2px; left:2px;
  width:20px; height:20px;
  border-radius:50%;
  background:var(--text-muted);
  transition:all var(--t-base);
}
.settings-toggle.on{
  background:rgba(93,232,168,.25);
  border-color:rgba(93,232,168,.5);
}
.settings-toggle.on::after{
  left:20px;
  background:var(--accent-menta);
  box-shadow:0 0 10px rgba(93,232,168,.6);
}
.settings-danger{
  width:100%;
  padding:12px;
  border-radius:var(--r-md);
  background:rgba(232,93,93,.12);
  border:1px solid rgba(232,93,93,.3);
  color:var(--accent-coral);
  font-size:13px; font-weight:700;
  transition:all var(--t-base);
  margin-top:8px;
}

<div class="toast-container" id="toast-container" aria-live="polite"></div>

<script>
/* ============================================================
   BALL SORT AURORA v9.0
   ============================================================ */
'use strict';

/* ---------- CONFIG ---------- */
const CONFIG = Object.freeze({
  MAX_LEVEL: 30,
  MAX_EXTRA_TUBES: 2,
  MAX_HISTORY: 100,
  MAX_GENERATION_RETRIES: 5,
  TOAST_DURATION: 1800,
  TOAST_SAFETY_TIMEOUT: 5000,
  WIN_MODAL_DELAY: 500,
  SAVE_DEBOUNCE: 400,
  RESIZE_DEBOUNCE: 150,
  STUCK_CHECK_DELAY: 300,
  COMBO_WINDOW_MS: 2500,
  SIZING: Object.freeze({
    TUBE_BALL_GAP: 12,
    TUBE_HEIGHT_PADDING: 14,
    BALL_MIN: 16,
    BALL_MAX: 40,
    AVAIL_H_RATIO: 0.42,
    AVAIL_W_MAX: 900,
    AVAIL_W_RATIO: 0.94,
    MIN_TUBES_PER_ROW: 4,
    TUBE_MIN_WIDTH: 54
  }),
  STORAGE_KEYS: Object.freeze({
    THEME: 'aurora.theme',
    LEVEL: 'aurora.level',
    COMPLETED: 'aurora.completed',
    SAVE: 'aurora.save',
    SOUND: 'aurora.sound',
    MODE: 'aurora.mode',
    SEED: 'aurora.seed'
  })
});

/* ---------- SeededRandom ---------- */
class SeededRandom {
  constructor(seed) { this._state = (seed | 0) >>> 0; }
  next() {
    let t = (this._state += 0x6D2B79F5) >>> 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(min, max) { return Math.floor(this.next() * (max - min + 1)) + min; }
  pick(arr) { return arr[this.int(0, arr.length - 1)]; }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.int(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  weighted(items) {
    const total = items.reduce((s, it) => s + it.weight, 0);
    let r = this.next() * total;
    for (const it of items) {
      r -= it.weight;
      if (r <= 0) return it.item;
    }
    return items[items.length - 1].item;
  }
}

/* ---------- SeedUtils ---------- */
const SeedUtils = {
  fromString(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  },
  toString(seed) { return (seed >>> 0).toString(36).toUpperCase().padStart(6, '0'); },
  fromURL() {
    const m = location.hash.match(/seed=([A-Z0-9]+)/i);
    return m ? parseInt(m[1], 36) >>> 0 : null;
  },
  toURL(seed) {
    const s = SeedUtils.toString(seed);
    try { history.replaceState(null, '', `#seed=${s}`); } catch {}
  },
  clearURLHash() {
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  },
  daily() {
    const d = new Date();
    return SeedUtils.fromString(`daily-${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`);
  },
  random() { return (Math.random() * 0xFFFFFFFF) >>> 0; }
};

const QueryUtils = {
  getMode() {
    try {
      const params = new URLSearchParams(location.search);
      const mode = params.get('mode');
      return mode && ['classic','challenge','chaos','daily'].includes(mode) ? mode : null;
    } catch { return null; }
  }
};

/* ---------- EventBus ---------- */
const EventBus = (() => {
  const listeners = new Map();
  return {
    on(event, handler) {
      if (!listeners.has(event)) listeners.set(event, new Set());
      listeners.get(event).add(handler);
      return () => listeners.get(event).delete(handler);
    },
    emit(event, payload) {
      const set = listeners.get(event);
      if (!set) return;
      set.forEach(fn => {
        try { fn(payload); } catch (e) { console.error(`[EventBus:${event}]`, e); }
      });
    }
  };
})();

/* ---------- Storage ---------- */
const Storage = {
  get(key, fallback = null) {
    try { const raw = localStorage.getItem(key); return raw === null ? fallback : raw; }
    catch { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, String(value)); } catch {} },
  getJSON(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
    catch { return fallback; }
  },
  setJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  remove(key) { try { localStorage.removeItem(key); } catch {} }
};

/* ---------- Haptics ---------- */
const Haptics = {
  tap() {
    try { navigator.vibrate?.(8); } catch {}
  },
  move() {
    try { navigator.vibrate?.(12); } catch {}
  },
  invalid() {
    try { navigator.vibrate?.([20, 40, 20]); } catch {}
  },
  success() {
    try { navigator.vibrate?.([10, 30, 10, 30, 20]); } catch {}
  }
};

/* ---------- Sound ---------- */
const Sound = (() => {
  let ctx = null;
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.SOUND, '1') === '1';
  let muted = false;

  const ensure = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  };

  const tone = (freq, type, duration, volume) => {
    if (!enabled || muted) return;
    const ac = ensure(); if (!ac) return;
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(now); osc.stop(now + duration);
  };

  return {
    isEnabled: () => enabled,
    isMuted: () => muted,
    setMuted: (m) => { muted = m; },
    toggle() {
      enabled = !enabled;
      Storage.set(CONFIG.STORAGE_KEYS.SOUND, enabled ? '1' : '0');
      if (enabled) tone(880, 'sine', .1, .1);
      return enabled;
    },
    select() { tone(620, 'sine', .07, .06); },
    move() { tone(420, 'triangle', .1, .07); },
    invalid() { tone(180, 'sawtooth', .15, .06); },
    complete() {
      [660, 880].forEach((f, i) => setTimeout(() => tone(f, 'sine', .2, .08), i * 60));
    },
    combo() {
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 'sine', .25, .09), i * 70));
    },
    win() {
      if (!enabled || muted) return;
      const ac = ensure(); if (!ac) return;
      const now = ac.currentTime;
      [523, 659, 784, 1046, 1318].forEach((freq, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = freq; o.type = 'sine';
        const t = now + i * .09;
        g.gain.setValueAtTime(.001, t);
        g.gain.exponentialRampToValueAtTime(.12, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + .4);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + .4);
      });
    }
  };
})();

/* ---------- Toaster ---------- */
const Toaster = (() => {
  const container = document.getElementById('toast-container');
  const queue = [];
  let active = false;

  const show = ({ msg, type }) => {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      el.remove();
      active = false;
      next();
    };
    setTimeout(finish, CONFIG.TOAST_DURATION);
    setTimeout(finish, CONFIG.TOAST_SAFETY_TIMEOUT);
  };

  const next = () => {
    if (active || queue.length === 0) return;
    active = true;
    show(queue.shift());
  };

  const enqueue = (msg, type) => { queue.push({ msg, type }); next(); };

  return {
    info: (msg) => enqueue(msg, 'info'),
    warn: (msg) => enqueue(msg, 'warn'),
    success: (msg) => enqueue(msg, 'success')
  };
})();

/* ---------- Particles ---------- */
const Particles = {
  burst(x, y, color = '#9B5DE8', count = 12) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist = 40 + Math.random() * 60;
      p.style.left = `${x}px`;
      p.style.top = `${y}px`;
      p.style.background = color;
      p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
      p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
      p.style.boxShadow = `0 0 10px ${color}`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }
};

/* ---------- Combo ---------- */
const Combo = (() => {
  let count = 0;
  let lastTime = 0;
  const banner = document.getElementById('combo-banner');
  const pill = document.getElementById('hud-combo-pill');
  const pillText = document.getElementById('hud-combo');

  const reset = () => {
    count = 0;
    pill.hidden = true;
  };

  const register = () => {
    const now = Date.now();
    if (now - lastTime > CONFIG.COMBO_WINDOW_MS) count = 0;
    count++;
    lastTime = now;

    if (count >= 2) {
      pill.hidden = false;
      pillText.textContent = `x${count}`;
      pill.classList.add('highlight');
      Sound.combo();
      Haptics.success();

      banner.textContent = `COMBO x${count}!`;
      banner.classList.remove('show');
      void banner.offsetWidth;
      banner.classList.add('show');

      setTimeout(() => pill.classList.remove('highlight'), 500);
    }
    return count;
  };

  return { register, reset };
})();

/* ---------- GameModes ---------- */
const GameModes = {
  classic:   { id:'classic',   label:'Clássico', icon:'🎯', noUndo:false, noExtraTube:false, chaos:false },
  challenge: { id:'challenge', label:'Desafio',  icon:'⚔️', noUndo:true,  noExtraTube:true,  chaos:false },
  chaos:     { id:'chaos',     label:'Caos',     icon:'🎲', noUndo:false, noExtraTube:false, chaos:true },
  daily:     { id:'daily',     label:'Diário',   icon:'📅', noUndo:false, noExtraTube:false, chaos:false, useDailySeed:true }
};

/* ---------- Palettes (Aurora cores) ---------- */
const Palettes = {
  classic: { colors: ['coral','menta','sky','mustard','violet','peach','lilac','aqua','rose','sage','sand','slate','plum'] },
  warm:    { colors: ['coral','peach','mustard','rose','plum'] },
  cool:    { colors: ['sky','aqua','menta','violet','slate'] },
  earth:   { colors: ['sand','sage','mustard','peach','slate'] },
  neon:    { colors: ['rose','aqua','menta','lilac','violet'] }
};

const RAINBOW = '__RAINBOW__';

/* ---------- Rules (v9 — rainbow restrito) ---------- */
const Rules = {
  isRainbow(color) { return color === RAINBOW; },
  top(tube) { return tube.length ? tube[tube.length - 1] : null; },

  isComplete(tube, bpt) {
    if (tube.length === 0 || tube.length !== bpt) return false;
    const nonRainbow = tube.filter(c => !Rules.isRainbow(c));
    if (nonRainbow.length === 0) return false;
    const first = nonRainbow[0];
    return nonRainbow.every(c => c === first);
  },

  /**
   * v9: rainbow só entra se o tubo já tem a cor final (ou está vazio).
   * Isso força preparar o terreno antes de usar o curinga.
   */
  canPlace(dest, color, bpt) {
    if (dest.length >= bpt) return false;
    if (dest.length === 0) return true;
    const topColor = Rules.top(dest);

    // Se a origem é rainbow
    if (Rules.isRainbow(color)) {
      // Só entra em vazio (já tratado) ou sobre rainbow, ou sobre tubo uniforme
      // E o tubo não pode estar completo (não desperdiça curinga)
      if (Rules.isComplete(dest, bpt)) return false;
      if (Rules.isRainbow(topColor)) return true;
      const nonRainbow = dest.filter(c => !Rules.isRainbow(c));
      if (nonRainbow.length === 0) return true;
      // só permite se o tubo já está uniforme (rainbow vira a cor dele)
      const first = nonRainbow[0];
      return nonRainbow.every(c => c === first);
    }

    // Se a origem é cor normal
    if (Rules.isRainbow(topColor)) {
      const nonRainbow = dest.filter(c => !Rules.isRainbow(c));
      if (nonRainbow.length === 0) return true;
      return nonRainbow.every(c => c === color);
    }
    return topColor === color;
  },

  allSolved(tubes, bpt) { return tubes.every(t => t.length === 0 || Rules.isComplete(t, bpt)); },
  hasAnyBall(tubes) { return tubes.some(t => t.length > 0); },
  hasAnyMove(tubes, bpt, tubeLimits) {
    for (let from = 0; from < tubes.length; from++) {
      const src = tubes[from];
      if (src.length === 0 || Rules.isComplete(src, bpt)) continue;
      if (tubeLimits && tubeLimits[from] === 0) continue;
      const color = Rules.top(src);
      for (let to = 0; to < tubes.length; to++) {
        if (from === to) continue;
        if (tubeLimits && tubeLimits[to] === 0) continue;
        if (Rules.canPlace(tubes[to], color, bpt)) return true;
      }
    }
    return false;
  }
};

/* ---------- DifficultyCurve ---------- */
const DifficultyCurve = {
  compute(level, mode, rng) {
    const baseColors = 4 + Math.floor((level - 1) * 0.7);
    const isSpike = level % 5 === 0 && level >= 5;
    const spikeBonus = isSpike ? 2 : 0;
    const numColors = Math.min(13, baseColors + spikeBonus);

    const ballWeighted = rng.weighted([
      { item:3, weight:level < 3 ? 0 : 1 },
      { item:4, weight:6 },
      { item:5, weight:level < 4 ? 1 : 3 },
      { item:6, weight:level < 8 ? 0 : 2 }
    ]);

    const emptyTubes = isSpike ? 1 : rng.weighted([
      { item:1, weight:level < 3 ? 0 : 2 },
      { item:2, weight:5 },
      { item:3, weight:level < 5 ? 0 : 2 }
    ]);

    const paletteKeys = mode.chaos ? ['classic','warm','cool','earth','neon'] : ['classic','warm','cool','earth'];
    const palette = rng.pick(paletteKeys);
    const reverseMultiplier = 8 + Math.floor(level * 0.5) + (isSpike ? 6 : 0);

    const modifiers = [];
    if (mode.chaos) {
      if (numColors >= 6 && rng.next() < 0.5) modifiers.push('blind');
      if (numColors >= 5 && rng.next() < 0.4) modifiers.push('rainbow');
      if (level >= 6 && rng.next() < 0.3) modifiers.push('limits');
    } else {
      if (level >= 8 && rng.next() < 0.15) modifiers.push('blind');
      if (level >= 6 && rng.next() < 0.2) modifiers.push('rainbow');
      if (level >= 10 && rng.next() < 0.18) modifiers.push('limits');
    }

    return { numColors, ballsPerTube:ballWeighted, emptyTubes, palette, isSpike, reverseMultiplier, modifiers };
  }
};

/* ---------- LevelGenerator ---------- */
const LevelGenerator = (() => {
  const isSolved = (tubes) => tubes.every(t => t.length === 0 || t.every(c => c === t[0]));

  const validReverseMoves = (tubes, bpt, last) => {
    const moves = [];
    for (let from = 0; from < tubes.length; from++) {
      if (tubes[from].length === 0) continue;
      const color = tubes[from][tubes[from].length - 1];
      if (color === RAINBOW) continue;
      for (let to = 0; to < tubes.length; to++) {
        if (from === to || tubes[to].length >= bpt) continue;
        if (tubes[to].length > 0) {
          const top = tubes[to][tubes[to].length - 1];
          if (top !== color && top !== RAINBOW) continue;
        }
        if (last && last.from === to && last.to === from) continue;
        moves.push({ from, to });
      }
    }
    return moves;
  };

  const shuffleBalls = (tubes, rng) => {
    const allBalls = tubes.flat();
    for (let i = allBalls.length - 1; i > 0; i--) {
      const j = rng.int(0, i);
      [allBalls[i], allBalls[j]] = [allBalls[j], allBalls[i]];
    }
    const bpt = tubes[0].length;
    const result = [];
    for (let i = 0; i < allBalls.length; i += bpt) {
      result.push(allBalls.slice(i, i + bpt));
    }
    return result;
  };

  const buildOnce = (level, modeId, seed) => {
    const mode = GameModes[modeId] || GameModes.classic;
    const rng = new SeededRandom(seed);
    const diff = DifficultyCurve.compute(level, mode, rng);
    const { numColors, ballsPerTube:bpt, emptyTubes, palette, reverseMultiplier, modifiers } = diff;

    const shuffledPalette = rng.shuffle(Palettes[palette].colors);
    const usedColors = shuffledPalette.slice(0, Math.min(numColors, shuffledPalette.length));

    const full = usedColors.map(c => Array(bpt).fill(c));
    const empty = Array.from({ length: emptyTubes }, () => []);

    if (modifiers.includes('rainbow')) {
      const maxRainbows = Math.min(2, Math.floor(numColors / 3));
      const rainbowCount = rng.int(1, Math.max(1, maxRainbows));
      const usedTubes = new Set();
      for (let i = 0; i < rainbowCount; i++) {
        let idx, attempts = 0;
        do { idx = rng.int(0, full.length - 1); attempts++; }
        while (usedTubes.has(idx) && attempts < 20);
        usedTubes.add(idx);
        full[idx][rng.int(0, bpt - 1)] = RAINBOW;
      }
    }

    let tubes = [...shuffleBalls(full, rng), ...empty];
    const steps = usedColors.length * reverseMultiplier + level * 4;
    let last = null, stuck = 0;
    for (let i = 0; i < steps; i++) {
      const moves = validReverseMoves(tubes, bpt, last);
      if (moves.length === 0) {
        if (++stuck > 5) break;
        continue;
      }
      stuck = 0;
      const m = moves[rng.int(0, moves.length - 1)];
      tubes[m.to].push(tubes[m.from].pop());
      last = m;
    }

    const blindIndices = [];
    if (modifiers.includes('blind')) {
      const candidates = tubes.map((_, i) => i).filter(i => tubes[i].length > 1);
      const blindCount = Math.min(2, Math.floor(candidates.length / 3));
      for (let i = 0; i < blindCount && candidates.length > 0; i++) {
        const pickIdx = rng.int(0, candidates.length - 1);
        blindIndices.push(candidates.splice(pickIdx, 1)[0]);
      }
    }

    // v9: tubos com limite de movimentos
    const tubeLimits = tubes.map(() => null);
    if (modifiers.includes('limits')) {
      const candidates = tubes.map((_, i) => i).filter(i => tubes[i].length > 0);
      const limitCount = Math.min(3, Math.floor(candidates.length / 3));
      for (let i = 0; i < limitCount && candidates.length > 0; i++) {
        const pickIdx = rng.int(0, candidates.length - 1);
        const idx = candidates.splice(pickIdx, 1)[0];
        // limite proporcional: 2-3 movimentos recebidos
        tubeLimits[idx] = rng.int(2, 3);
      }
    }

    return {
      tubes,
      meta: {
        seed, mode:modeId, level, numColors:usedColors.length, ballsPerTube:bpt,
        emptyTubes, palette, modifiers, blindIndices, maxBalls:bpt
      },
      tubeLimits
    };
  };

  const generate = (level, modeId, seed) => {
    for (let attempt = 0; attempt < CONFIG.MAX_GENERATION_RETRIES; attempt++) {
      const result = buildOnce(level, modeId, (seed + attempt) >>> 0);
      if (!(isSolved(result.tubes) && level > 1)) return result;
    }
    return buildOnce(level, modeId, seed);
  };

  return { generate, isSolved };
})();

/* ---------- GameState ---------- */
class GameState {
  constructor() {
    this.level = 1;
    this.moves = 0;
    this.tubes = [];
    this.bpt = 4;
    this.meta = null;
    this.tubeLimits = [];
    this.extraTubes = 0;
    this.selected = null;
    this.history = [];
    this.zenMode = false;
    this.completed = false;
    this.startTime = Date.now();
    this.mode = QueryUtils.getMode() || Storage.get(CONFIG.STORAGE_KEYS.MODE, 'classic');
    this.seed = SeedUtils.fromURL() || SeedUtils.random();
    this.completedLevels = Storage.getJSON(CONFIG.STORAGE_KEYS.COMPLETED, []) || [];
    this.theme = Storage.get(CONFIG.STORAGE_KEYS.THEME, 'dark');
  }

  elapsed() { return Math.max(0, Math.round((Date.now() - this.startTime) / 1000)); }

  snapshot() {
    return {
      tubes: this.tubes.map(t => t.slice()),
      moves: this.moves,
      selected: this.selected,
      extraTubes: this.extraTubes,
      tubeLimits: this.tubeLimits.slice(),
      completed: this.completed
    };
  }
  pushHistory() {
    this.history.push(this.snapshot());
    if (this.history.length > CONFIG.MAX_HISTORY) this.history.shift();
  }
  popHistory() {
    const snap = this.history.pop();
    if (!snap) return false;
    this.tubes = snap.tubes.map(t => t.slice());
    this.moves = snap.moves;
    this.selected = null;
    this.extraTubes = snap.extraTubes;
    this.tubeLimits = snap.tubeLimits || [];
    this.completed = false;
    return true;
  }
  markCompleted(level) {
    if (!this.completedLevels.includes(level)) {
      this.completedLevels.push(level);
      Storage.setJSON(CONFIG.STORAGE_KEYS.COMPLETED, this.completedLevels);
    }
  }
  saveLevel() { Storage.set(CONFIG.STORAGE_KEYS.LEVEL, this.level); }
  saveMode() { Storage.set(CONFIG.STORAGE_KEYS.MODE, this.mode); }

  saveGame() {
    Storage.setJSON(CONFIG.STORAGE_KEYS.SAVE, {
      level:this.level, moves:this.moves, tubes:this.tubes, bpt:this.bpt,
      meta:this.meta, tubeLimits:this.tubeLimits, extraTubes:this.extraTubes,
      history:this.history.slice(-20), mode:this.mode, seed:this.seed, startTime:this.startTime
    });
  }
  loadSavedGame() {
    const save = Storage.getJSON(CONFIG.STORAGE_KEYS.SAVE, null);
    if (!save || !Array.isArray(save.tubes) || save.tubes.length === 0) return false;
    this.level = save.level || 1;
    this.moves = save.moves || 0;
    this.tubes = save.tubes;
    this.bpt = save.bpt || 4;
    this.meta = save.meta || null;
    this.tubeLimits = save.tubeLimits || [];
    this.extraTubes = save.extraTubes || 0;
    this.history = save.history || [];
    this.mode = QueryUtils.getMode() || save.mode || 'classic';
    this.seed = save.seed || SeedUtils.random();
    this.selected = null;
    this.completed = false;
    this.startTime = save.startTime || Date.now();
    return true;
  }
  clearSave() { Storage.remove(CONFIG.STORAGE_KEYS.SAVE); }
}

/* ---------- GameController ---------- */
class GameController {
  constructor(state) {
    this.state = state;
    this._saveDebounceId = null;
    this._stuckTimerId = null;
  }

  getMode() { return GameModes[this.state.mode] || GameModes.classic; }

  _scheduleSave() {
    clearTimeout(this._saveDebounceId);
    this._saveDebounceId = setTimeout(() => this.state.saveGame(), CONFIG.SAVE_DEBOUNCE);
  }

  _clearStuckTimer() {
    if (this._stuckTimerId) {
      clearTimeout(this._stuckTimerId);
      this._stuckTimerId = null;
    }
  }

  loadLevel(level, { silent = false, seed = null, clearHash = false } = {}) {
    const s = this.state;
    const mode = this.getMode();

    if (mode.useDailySeed) seed = SeedUtils.daily();
    else if (seed === null) seed = SeedUtils.random();

    s.level = level;
    s.moves = 0;
    s.seed = seed;
    s.startTime = Date.now();
    this._clearStuckTimer();
    Combo.reset();

    const generated = LevelGenerator.generate(level, s.mode, seed);
    s.tubes = generated.tubes;
    s.meta = generated.meta;
    s.bpt = generated.meta.ballsPerTube;
    s.tubeLimits = generated.tubeLimits;
    s.extraTubes = 0;
    s.selected = null;
    s.history = [];
    s.completed = false;

    if (!silent) {
      s.saveLevel();
      s.saveGame();
      SeedUtils.toURL(seed);
      if (clearHash) SeedUtils.clearURLHash();
    }
    EventBus.emit('state:changed');
    EventBus.emit('level:loaded', { level, meta: s.meta, seed });
  }

  restart() {
    this.loadLevel(this.state.level, { silent: true, seed: this.state.seed });
    EventBus.emit('toast:info', 'Nível reiniciado');
  }

  setMode(modeId) {
    if (!GameModes[modeId]) return;
    this.state.mode = modeId;
    this.state.saveMode();
    EventBus.emit('mode:changed', modeId);
    this.loadLevel(this.state.level);
    EventBus.emit('toast:info', `${GameModes[modeId].icon} ${GameModes[modeId].label}`);
  }

  newSeed() {
    this.loadLevel(this.state.level, { seed: SeedUtils.random() });
    EventBus.emit('toast:info', '🎲 Nova seed');
  }

  selectTube(idx) {
    const s = this.state;
    if (s.completed) return;
    if (!s.tubes[idx]) return;
    if (s.tubeLimits[idx] === 0) {
      EventBus.emit('tube:invalid', idx);
      Sound.invalid();
      Haptics.invalid();
      return;
    }

    if (s.selected === idx) {
      s.selected = null;
      EventBus.emit('state:changed');
      return;
    }

    if (s.selected !== null) {
      if (this.tryMove(s.selected, idx)) return;
      const target = s.tubes[idx];
      if (target.length > 0 && !Rules.isComplete(target, s.bpt)) {
        s.selected = idx;
        Sound.select();
        Haptics.tap();
      } else {
        s.selected = null;
        EventBus.emit('tube:invalid', idx);
        Haptics.invalid();
      }
      EventBus.emit('state:changed');
      return;
    }

    const tube = s.tubes[idx];
    if (tube.length === 0 || Rules.isComplete(tube, s.bpt)) {
      EventBus.emit('tube:invalid', idx);
      return;
    }
    s.selected = idx;
    Sound.select();
    Haptics.tap();
    EventBus.emit('state:changed');
  }

  tryMove(fromIdx, toIdx) {
    const s = this.state;
    const from = s.tubes[fromIdx];
    const to = s.tubes[toIdx];

    if (Rules.isComplete(from, s.bpt)) {
      Toaster.warn('Este tubo já está completo');
      s.selected = null;
      EventBus.emit('state:changed');
      return false;
    }
    if (from.length === 0) {
      s.selected = null;
      EventBus.emit('state:changed');
      return false;
    }
    if (s.tubeLimits[toIdx] === 0) {
      Sound.invalid();
      Haptics.invalid();
      EventBus.emit('tube:invalid', toIdx);
      return false;
    }

    const color = Rules.top(from);
    if (!Rules.canPlace(to, color, s.bpt)) {
      Sound.invalid();
      Haptics.invalid();
      EventBus.emit('tube:invalid', toIdx);
      return false;
    }

    const fromCopy = from.slice();
    const toCopy = to.slice();
    let count = 0;
    while (fromCopy.length > 0 && Rules.top(fromCopy) === color && Rules.canPlace(toCopy, color, s.bpt)) {
      toCopy.push(fromCopy.pop());
      count++;
    }
    if (count === 0) {
      s.selected = null;
      EventBus.emit('state:changed');
      return false;
    }

    s.pushHistory();
    s.tubes[fromIdx] = fromCopy;
    s.tubes[toIdx] = toCopy;

    // Decrementa limite do tubo destino
    if (s.tubeLimits[toIdx] !== null && s.tubeLimits[toIdx] !== undefined) {
      s.tubeLimits[toIdx] = Math.max(0, s.tubeLimits[toIdx] - 1);
    }

    s.moves++;
    Sound.move();
    Haptics.move();
    EventBus.emit('ball:moved', { count });
    s.selected = null;

    // Combo se completou tubo
    if (Rules.isComplete(s.tubes[toIdx], s.bpt)) {
      Sound.complete();
      const comboCount = Combo.register();
      // Partículas no centro do tubo
      const tubeEl = document.querySelectorAll('.tube')[toIdx];
      if (tubeEl) {
        const rect = tubeEl.getBoundingClientRect();
        Particles.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#5DE8A8', 14);
      }
    }

    this.checkWin();
    this._scheduleSave();

    this._clearStuckTimer();
    this._stuckTimerId = setTimeout(() => {
      this._stuckTimerId = null;
      if (!s.completed && Rules.hasAnyBall(s.tubes) && !Rules.hasAnyMove(s.tubes, s.bpt, s.tubeLimits)) {
        EventBus.emit('game:stuck');
      }
    }, CONFIG.STUCK_CHECK_DELAY);

    EventBus.emit('state:changed');
    return true;
  }

  checkWin() {
    const s = this.state;
    if (!Rules.allSolved(s.tubes, s.bpt) || !Rules.hasAnyBall(s.tubes)) return;
    s.completed = true;
    s.markCompleted(s.level);
    s.clearSave();
    this._clearStuckTimer();
    Sound.win();
    Haptics.success();
    EventBus.emit('level:won', {
      level: s.level,
      moves: s.moves,
      time: s.elapsed()
    });
  }

  undo() {
    if (this.getMode().noUndo) { Toaster.warn('Desafio não permite desfazer'); return; }
    if (this.state.history.length === 0) { Toaster.info('Nada para desfazer'); return; }
    this._clearStuckTimer();
    Combo.reset();
    this.state.popHistory();
    Sound.select();
    Haptics.tap();
    this._scheduleSave();
    EventBus.emit('state:changed');
  }

  addExtraTube() {
    if (this.getMode().noExtraTube) { Toaster.warn('Desafio não permite tubo extra'); return; }
    const s = this.state;
    if (s.extraTubes >= CONFIG.MAX_EXTRA_TUBES) {
      Toaster.warn(`Máximo de ${CONFIG.MAX_EXTRA_TUBES} tubos extras`);
      return;
    }
    s.pushHistory();
    s.tubes.push([]);
    s.tubeLimits.push(null);
    s.extraTubes++;
    Sound.select();
    Haptics.tap();
    this._scheduleSave();
    EventBus.emit('state:changed');
  }

  toggleZen() {
    this.state.zenMode = !this.state.zenMode;
    Sound.setMuted(this.state.zenMode);
    EventBus.emit('zen:toggled', this.state.zenMode);
    Toaster.info(this.state.zenMode ? '🧘 Zen ativado' : 'Modo Zen desativado');
  }

  hint() {
    if (this.state.zenMode) { Toaster.info('🧘 Zen: dicas desativadas'); return; }
    const s = this.state;
    s.selected = null;

    const nonEmpties = [];
    const empties = [];
    for (let from = 0; from < s.tubes.length; from++) {
      const src = s.tubes[from];
      if (src.length === 0 || Rules.isComplete(src, s.bpt)) continue;
      if (s.tubeLimits[from] === 0) continue;
      const color = Rules.top(src);
      for (let to = 0; to < s.tubes.length; to++) {
        if (from === to) continue;
        if (s.tubeLimits[to] === 0) continue;
        if (!Rules.canPlace(s.tubes[to], color, s.bpt)) continue;
        if (s.tubes[to].length === 0) empties.push({ from, to });
        else nonEmpties.push({ from, to });
      }
    }
    const pick = nonEmpties[0] || empties[0];
    if (pick) EventBus.emit('hint:show', pick);
    else Toaster.warn('Sem movimentos disponíveis');
  }

  nextLevel() {
    const next = Math.min(this.state.level + 1, CONFIG.MAX_LEVEL);
    this.loadLevel(next);
  }
}

/* ---------- Renderer ---------- */
class Renderer {
  constructor(state) {
    this.state = state;
    this._els = {
      boardArea: document.getElementById('board-area'),
      tubes: document.getElementById('tubes-container'),
      hudLevel: document.getElementById('hud-level'),
      hudMoves: document.getElementById('hud-moves'),
      hudMode: document.getElementById('hud-mode-label'),
      hudComboPill: document.getElementById('hud-combo-pill'),
      hudCombo: document.getElementById('hud-combo'),
      btnUndo: document.getElementById('btn-undo'),
      btnAddTube: document.getElementById('btn-add-tube'),
      btnZen: document.getElementById('btn-zen'),
      btnTheme: document.getElementById('btn-theme'),
      seedText: document.getElementById('seed-text'),
      winModal: document.getElementById('modal-win'),
      winMoves: document.getElementById('win-moves'),
      winLevel: document.getElementById('win-level'),
      winTime: document.getElementById('win-time'),
      levelScroller: document.getElementById('level-scroller'),
      modeSelect: document.getElementById('mode-select'),
      settingsModal: document.getElementById('modal-settings'),
      toggleSound: document.getElementById('toggle-sound')
    };
    this.onTubeClick = null;
    this._lastBallSize = null;
    this._hintTimers = [];
    this._tubeEls = [];
    this._transitions = null;
  }

  bindTubeClick(handler) { this.onTubeClick = handler; }

  render() {
    this.renderTubes();
    this.renderStats();
    this.renderControls();
    this.renderTheme();
    this.renderZenBody();
    this.renderSettings();
  }

  renderTubes() {
    const s = this.state;
    const maxBalls = s.meta ? s.meta.maxBalls : 6;
    const ballSize = this.computeBallSize(maxBalls, s.tubes.length);
    const tubeH = ballSize * maxBalls + CONFIG.SIZING.TUBE_HEIGHT_PADDING;
    const tubeW = ballSize + CONFIG.SIZING.TUBE_BALL_GAP;

    if (ballSize !== this._lastBallSize) {
      document.documentElement.style.setProperty('--bw', `${ballSize}px`);
      this._lastBallSize = ballSize;
    }

    const selectedOrigin = s.selected !== null ? s.tubes[s.selected] : null;
    const selectedColor = selectedOrigin && selectedOrigin.length && !Rules.isComplete(selectedOrigin, s.bpt)
      ? Rules.top(selectedOrigin) : null;

    const container = this._els.tubes;
    const needRecreate = this._tubeEls.length !== s.tubes.length;

    if (needRecreate) {
      const frag = document.createDocumentFragment();
      this._tubeEls = [];
      s.tubes.forEach((_, idx) => {
        const el = this._createTubeElement(idx);
        this._tubeEls.push(el);
        frag.appendChild(el);
      });
      container.replaceChildren(frag);
    }

    s.tubes.forEach((tube, idx) => {
      const el = this._tubeEls[idx];
      el.style.setProperty('--th', `${tubeH}px`);
      el.style.setProperty('--tw', `${tubeW}px`);

      const isBlind = s.meta && s.meta.blindIndices && s.meta.blindIndices.includes(idx);
      const isSelected = s.selected === idx;
      const isComplete = Rules.isComplete(tube, s.bpt);
      const limit = s.tubeLimits[idx];
      const isLocked = limit === 0;

      el.classList.toggle('selected', isSelected);
      el.classList.toggle('complete', isComplete);
      el.classList.toggle('has-limit', limit !== null && limit !== undefined);
      el.classList.toggle('tube-locked', isLocked);

      const isDestination = selectedColor !== null && idx !== s.selected &&
        !isLocked && Rules.canPlace(tube, selectedColor, s.bpt);
      el.classList.toggle('destination', isDestination);

      el.setAttribute('aria-label', `Tubo ${idx + 1}, ${tube.length} bolas${isComplete ? ', completo' : ''}${isLocked ? ', travado' : ''}`);

      // Badge de limite
      let badge = el.querySelector('.tube-limit-badge');
      if (limit !== null && limit !== undefined) {
        if (!badge) {
          badge = document.createElement('div');
          badge.className = 'tube-limit-badge';
          el.appendChild(badge);
        }
        badge.textContent = limit;
      } else if (badge) {
        badge.remove();
      }

      this._syncBalls(el, tube, { isBlind, isSelected });
    });
  }

  _createTubeElement(idx) {
    const el = document.createElement('div');
    el.className = 'tube';
    el.dataset.index = idx;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.addEventListener('click', () => this.onTubeClick && this.onTubeClick(idx));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.onTubeClick && this.onTubeClick(idx);
      }
    });
    return el;
  }

  _syncBalls(tubeEl, tube, { isBlind, isSelected }) {
    // Ignora o badge (último filho pode ser badge)
    const ballEls = Array.from(tubeEl.querySelectorAll('.ball'));
    const targetCount = tube.length;

    if (ballEls.length > targetCount) {
      for (let i = ballEls.length - 1; i >= targetCount; i--) ballEls[i].remove();
      ballEls.length = targetCount;
    } else if (ballEls.length < targetCount) {
      for (let i = ballEls.length; i < targetCount; i++) {
        const ball = document.createElement('div');
        ball.className = 'ball animated';
        tubeEl.appendChild(ball);
        ballEls.push(ball);
      }
    }

    tube.forEach((color, ballIdx) => {
      const ball = ballEls[ballIdx];
      if (!ball) return;
      const isRainbow = Rules.isRainbow(color);
      const hideColor = isBlind && !isSelected;

      let cls = 'ball';
      if (hideColor) cls += ' blind';
      else if (isRainbow) cls += ' rainbow';
      else cls += ` ${color}`;

      if (ball.className !== cls) ball.className = cls;
    });
  }

  computeBallSize(maxBalls, numTubes) {
    const { SIZING } = CONFIG;
    const vh = window.innerHeight;
    const vw = window.innerWidth;
    const availH = vh * SIZING.AVAIL_H_RATIO;
    const availW = Math.min(vw * SIZING.AVAIL_W_RATIO, SIZING.AVAIL_W_MAX);
    const sizeByH = Math.floor((availH - 20) / maxBalls) - 4;
    const perRow = Math.min(numTubes, Math.max(SIZING.MIN_TUBES_PER_ROW, Math.floor(availW / SIZING.TUBE_MIN_WIDTH)));
    const sizeByW = Math.floor((availW / perRow) - CONFIG.SIZING.TUBE_BALL_GAP);
    return Math.max(SIZING.BALL_MIN, Math.min(SIZING.BALL_MAX, Math.min(sizeByH, sizeByW)));
  }

  renderStats() {
    this._els.hudLevel.textContent = this.state.level;
    this._els.hudMoves.textContent = this.state.moves;
    this._els.hudMode.textContent = (GameModes[this.state.mode] || GameModes.classic).label;
  }

  renderControls() {
    const mode = GameModes[this.state.mode] || GameModes.classic;
    this._els.btnUndo.disabled = this.state.history.length === 0 || mode.noUndo;
    this._els.btnAddTube.disabled = this.state.extraTubes >= CONFIG.MAX_EXTRA_TUBES || mode.noExtraTube;
    this._els.btnZen.classList.toggle('active', this.state.zenMode);
    this._els.btnZen.setAttribute('aria-pressed', String(this.state.zenMode));
  }

  renderTheme() {
    document.documentElement.setAttribute('data-theme', this.state.theme);
    this._els.btnTheme.textContent = this.state.theme === 'dark' ? '🌙' : '☀️';
  }

  renderZenBody() {
    document.body.classList.toggle('zen-mode', this.state.zenMode);
  }

  renderSettings() {
    // Sound toggle
    this._els.toggleSound.classList.toggle('on', Sound.isEnabled());

    // Mode select
    const modeSelect = this._els.modeSelect;
    if (modeSelect.children.length === 0) {
      Object.values(GameModes).forEach(m => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.mode = m.id;
        btn.textContent = `${m.icon} ${m.label}`;
        btn.addEventListener('click', () => this._onModeSelect?.(m.id));
        modeSelect.appendChild(btn);
      });
    }
    for (const btn of modeSelect.children) {
      btn.classList.toggle('on', btn.dataset.mode === this.state.mode);
    }

    // Level scroller
    const scroller = this._els.levelScroller;
    if (scroller.children.length !== CONFIG.MAX_LEVEL) {
      scroller.replaceChildren();
      for (let i = 1; i <= CONFIG.MAX_LEVEL; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'level-chip';
        btn.textContent = i;
        btn.dataset.level = i;
        btn.addEventListener('click', () => this._onLevelSelect?.(i));
        scroller.appendChild(btn);
      }
    }
    for (const btn of scroller.children) {
      const lvl = Number(btn.dataset.level);
      btn.classList.toggle('on', lvl === this.state.level);
      btn.classList.toggle('done', this.state.completedLevels.includes(lvl));
    }

    // Seed
    if (this._els.seedText) this._els.seedText.textContent = SeedUtils.toString(this.state.seed);
  }

  setSettingsHandlers({ onModeSelect, onLevelSelect }) {
    this._onModeSelect = onModeSelect;
    this._onLevelSelect = onLevelSelect;
  }

  flashInvalid(idx) {
    const el = this._tubeEls[idx];
    if (!el) return;
    el.classList.remove('invalid');
    void el.offsetWidth;
    el.classList.add('invalid');
    setTimeout(() => el.classList.remove('invalid'), 420);
  }

  flashHint(from, to) {
    this._hintTimers.forEach(clearTimeout);
    this._hintTimers = [];
    [from, to].forEach(i => {
      const el = this._tubeEls[i];
      if (!el) return;
      el.classList.remove('hint');
      void el.offsetWidth;
      el.classList.add('hint');
      const tid = setTimeout(() => el.classList.remove('hint'), 1400);
      this._hintTimers.push(tid);
    });
  }

  fadeBoard(callback) {
    this._els.boardArea.classList.add('fade-out');
    setTimeout(() => {
      callback?.();
      requestAnimationFrame(() => {
        this._els.boardArea.classList.remove('fade-out');
      });
    }, 250);
  }

  openWinModal({ level, moves, time }) {
    this._els.winMoves.textContent = moves;
    this._els.winLevel.textContent = level;
    this._els.winTime.textContent = `${time}s`;
    this._els.winModal.classList.add('active');
  }
  closeWinModal() { this._els.winModal.classList.remove('active'); }

  openSettings() { this._els.settingsModal.classList.add('active'); }
  closeSettings() { this._els.settingsModal.classList.remove('active'); }

  toggleTheme() {
    this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
    Storage.set(CONFIG.STORAGE_KEYS.THEME, this.state.theme);
    this.renderTheme();
  }

  flashSeedCopied() {
    const el = this._els.seedText;
    if (!el) return;
    const old = el.textContent;
    el.textContent = '✓ Copiado!';
    setTimeout(() => { el.textContent = old; }, 900);
  }

  showExitScreen() {
    const screen = document.createElement('div');
    screen.className = 'exit-screen';
    const h1 = document.createElement('h1');
    h1.textContent = '🚪 Até logo';
    const p = document.createElement('p');
    p.textContent = 'Obrigado por jogar Ball Sort Aurora!';
    const btn = document.createElement('button');
    btn.className = 'modal-btn';
    btn.type = 'button';
    btn.textContent = '▶ Jogar Novamente';
    btn.addEventListener('click', () => location.reload());
    screen.append(h1, p, btn);
    document.body.appendChild(screen);
  }
}

/* ---------- PWA Manager ---------- */
const PWA = (() => {
  let deferredPrompt = null;
  const btnInstall = document.getElementById('btn-install');
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const hideButton = () => { if (btnInstall) btnInstall.hidden = true; };
  const showButton = () => { if (btnInstall && !isStandalone()) btnInstall.hidden = false; };

  const init = () => {
    if (isStandalone()) { hideButton(); return; }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showButton();
    });
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      hideButton();
      Toaster.success('✅ Instalado!');
    });
    btnInstall?.addEventListener('click', async () => {
      if (!deferredPrompt) { Toaster.info('Use o menu do navegador'); return; }
      try {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') Toaster.success('🎉 Instalando...');
        deferredPrompt = null;
        hideButton();
      } catch (err) { console.warn(err); }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('[SW]', err));
      });
    }
  };
  return { init, isStandalone };
})();

/* ---------- Bootstrap ---------- */
(function App() {
  const state = new GameState();
  const controller = new GameController(state);
  const renderer = new Renderer(state);

  const urlMode = QueryUtils.getMode();
  const hadUrlSeed = SeedUtils.fromURL() !== null;
  if (urlMode) {
    state.saveMode();
    try {
      const cleanSearch = location.search.replace(/[?&]mode=[^&]*/g, '').replace(/^&/, '?');
      history.replaceState(null, '', location.pathname + (cleanSearch === '?' ? '' : cleanSearch) + location.hash);
    } catch {}
  }

  PWA.init();
  renderer.bindTubeClick(idx => controller.selectTube(idx));
  renderer.setSettingsHandlers({
    onModeSelect: (m) => { controller.setMode(m); renderer.renderSettings(); },
    onLevelSelect: (lvl) => { controller.loadLevel(lvl); renderer.closeSettings(); }
  });

  /* Eventos */
  EventBus.on('state:changed', () => renderer.render());
  EventBus.on('tube:invalid', idx => renderer.flashInvalid(idx));
  EventBus.on('toast:info', msg => Toaster.info(msg));
  EventBus.on('toast:warn', msg => Toaster.warn(msg));
  EventBus.on('toast:success', msg => Toaster.success(msg));
  EventBus.on('hint:show', ({ from, to }) => renderer.flashHint(from, to));
  EventBus.on('level:won', ({ level, moves, time }) => {
    setTimeout(() => renderer.openWinModal({ level, moves, time }), CONFIG.WIN_MODAL_DELAY);
  });
  EventBus.on('game:stuck', () => {
    if (state.completed) return;
    const mode = controller.getMode();
    if (!mode.noUndo && state.history.length > 0) {
      Toaster.warn('😵 Sem movimentos — desfazendo...');
      setTimeout(() => controller.undo(), 800);
    } else {
      Toaster.warn('😵 Sem movimentos — reiniciando...');
      setTimeout(() => controller.restart(), 1100);
    }
  });

  /* HUD */
  document.getElementById('btn-theme').addEventListener('click', () => renderer.toggleTheme());

  /* Dock */
  document.getElementById('btn-undo').addEventListener('click', () => controller.undo());
  document.getElementById('btn-hint').addEventListener('click', () => controller.hint());
  document.getElementById('btn-restart').addEventListener('click', () => {
    renderer.fadeBoard(() => controller.restart());
  });
  document.getElementById('btn-add-tube').addEventListener('click', () => controller.addExtraTube());
  document.getElementById('btn-zen').addEventListener('click', () => controller.toggleZen());
  document.getElementById('btn-settings').addEventListener('click', () => renderer.openSettings());

  /* Win modal */
  document.getElementById('btn-next-level').addEventListener('click', () => {
    renderer.closeWinModal();
    renderer.fadeBoard(() => controller.nextLevel());
  });
  document.getElementById('modal-win').addEventListener('click', (e) => {
    if (e.target.id === 'modal-win') renderer.closeWinModal();
  });

  /* Settings modal */
  document.getElementById('btn-close-settings').addEventListener('click', () => renderer.closeSettings());
  document.getElementById('modal-settings').addEventListener('click', (e) => {
    if (e.target.id === 'modal-settings') renderer.closeSettings();
  });
  document.getElementById('toggle-sound').addEventListener('click', () => {
    Sound.toggle();
    renderer.renderSettings();
    if (Sound.isEnabled()) Toaster.success('🔊 Som ligado');
    else Toaster.info('🔇 Som desligado');
  });
  document.getElementById('btn-exit').addEventListener('click', () => {
    state.clearSave();
    renderer.closeSettings();
    renderer.showExitScreen();
  });
  document.getElementById('seed-text').parentElement.addEventListener('click', () => {
    const seedStr = SeedUtils.toString(state.seed);
    const url = `${location.origin}${location.pathname}#seed=${seedStr}`;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => { Toaster.success('🔗 Link copiado!'); renderer.flashSeedCopied(); })
        .catch(() => Toaster.info(`Seed: ${seedStr}`));
    } else Toaster.info(`Seed: ${seedStr}`);
  });
  document.getElementById('btn-shuffle-seed').addEventListener('click', () => controller.newSeed());

  /* Teclado */
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t.matches('input, textarea') || t.isContentEditable) return;
    const key = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && key === 'z') { e.preventDefault(); controller.undo(); }
    else if (key === 'r') controller.restart();
    else if (key === 't') controller.addExtraTube();
    else if (key === 'h') controller.hint();
    else if (key === 'escape') {
      if (state.selected !== null) {
        state.selected = null;
        EventBus.emit('state:changed');
      } else {
        renderer.closeWinModal();
        renderer.closeSettings();
      }
    }
  });

  /* Resize */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      renderer._lastBallSize = null;
      renderer._tubeEls = [];
      renderer.render();
    }, CONFIG.RESIZE_DEBOUNCE);
  });

  /* Init */
  renderer.renderTheme();
  if (state.loadSavedGame()) {
    EventBus.emit('state:changed');
    Toaster.info(`Partida restaurada · Nível ${state.level}`);
    if (hadUrlSeed) SeedUtils.clearURLHash();
  } else {
    const savedLevel = Math.max(1, Math.min(
      CONFIG.MAX_LEVEL,
      parseInt(Storage.get(CONFIG.STORAGE_KEYS.LEVEL, '1'), 10) || 1
    ));
    controller.loadLevel(savedLevel);
  }
})();
</script>
