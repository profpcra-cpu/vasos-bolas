<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ball Sort">
<meta name="theme-color" content="#1a0b2e">
<title>Ball Sort Puzzle</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#1a0b2e; --bg-2:#2d1b4e; --bg-3:#0f0520;
  --text:#f5f0ff; --text-muted:#a78bfa; --text-dim:#6b5b8a;
  --surface:rgba(255,255,255,.06);
  --surface-hover:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.15);
  --tube-border:rgba(255,255,255,.85);
  --tube-bg:rgba(255,255,255,.06);
  --tube-shadow:inset 0 0 20px rgba(255,255,255,.15),inset 0 -10px 30px rgba(0,0,0,.4);
  --accent-1:#a855f7; --accent-2:#ec4899; --accent-3:#06b6d4;
  --success:#4ade80; --warning:#f59e0b; --danger:#ef4444;
  --btn-bg:linear-gradient(135deg,#a855f7,#ec4899);
  --btn-accent:linear-gradient(135deg,#06b6d4,#3b82f6);
  --shadow-sm:0 4px 12px rgba(0,0,0,.25);
  --shadow-md:0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --glow-purple:0 0 24px rgba(168,85,247,.55);
  --glow-green:0 0 24px rgba(74,222,128,.55);
  --glow-gold:0 0 24px rgba(251,191,36,.7);
  --t-fast:.15s cubic-bezier(.16,1,.3,1);
  --t-base:.25s cubic-bezier(.16,1,.3,1);
  --t-slow:.4s cubic-bezier(.16,1,.3,1);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
  --radius-full:999px;
}
[data-theme="light"]{
  --bg-1:#f5f0ff; --bg-2:#e0e7ff; --bg-3:#ffffff;
  --text:#1a0b2e; --text-muted:#7c3aed; --text-dim:#a89bc4;
  --surface:rgba(30,20,60,.05);
  --surface-hover:rgba(30,20,60,.1);
  --border:rgba(30,20,60,.15);
  --tube-border:rgba(30,20,60,.9);
  --tube-bg:rgba(30,20,60,.04);
  --tube-shadow:inset 0 0 20px rgba(0,0,0,.05),inset 0 -10px 30px rgba(0,0,0,.08);
  --shadow-sm:0 4px 12px rgba(30,20,60,.1);
  --shadow-md:0 8px 24px rgba(30,20,60,.15);
  --shadow-lg:0 16px 48px rgba(30,20,60,.2);
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  height:100%; margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  color:var(--text);
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent-1);outline-offset:3px;border-radius:var(--radius-sm)}

body{
  background:radial-gradient(circle at 30% 20%,var(--bg-2) 0%,var(--bg-1) 45%,var(--bg-3) 100%);
  display:flex; flex-direction:column; min-height:100dvh;
}
body.zen-mode .stats,
body.zen-mode .bottom-bar .btn:not(#btn-zen):not(#btn-exit),
body.zen-mode #btn-hint{display:none !important}
body.zen-mode .navbar{opacity:.55}
body.zen-mode .navbar:hover{opacity:1}

.navbar{
  display:flex; flex-direction:column;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow-sm);
  z-index:100;
  transition:opacity var(--t-base);
}
.nav-top-row{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  padding:10px 16px;
  gap:12px;
}
.nav-actions{display:flex; gap:8px; align-items:center}
.btn-icon{
  width:38px; height:38px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--t-base);
}
.btn-icon:hover{background:var(--surface-hover); transform:translateY(-2px)}
.btn-icon:active{transform:translateY(0) scale(.95)}
.btn-icon[hidden]{display:none}

.btn-install{
  animation:installPulse 2.4s ease-in-out infinite;
  background:rgba(74,222,128,.12);
  border-color:rgba(74,222,128,.4);
}
.btn-install:hover{background:rgba(74,222,128,.22)}
@keyframes installPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}
  50%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
}

.stats{display:flex; gap:16px; align-items:center; justify-content:center}
.stat{display:flex; flex-direction:column; align-items:center; gap:1px; min-width:36px}
.stat-value{
  font-size:15px; font-weight:800;
  font-variant-numeric:tabular-nums;
  color:var(--text);
}
.stat-label{
  font-size:8px; text-transform:uppercase;
  letter-spacing:1px; color:var(--text-muted); font-weight:600;
}

.nav-dropdown-toggle{
  display:flex; align-items:center; justify-content:center; gap:4px;
  font-size:10px; font-weight:700;
  color:var(--text-muted);
  padding:4px 10px;
  background:var(--surface);
  border-top:1px solid var(--border);
  cursor:pointer;
  transition:all var(--t-base);
  text-transform:uppercase;
  letter-spacing:.5px;
}
.nav-dropdown-toggle:hover{background:var(--surface-hover); color:var(--text)}

.nav-collapse-content{
  display:flex;
  flex-direction:column;
  gap:8px; padding:0 16px;
  max-height:0;
  overflow:hidden;
  background:rgba(15, 5, 32, 0.4);
  border-top:1px solid transparent;
  transition:max-height var(--t-slow), padding var(--t-slow), border-color var(--t-slow);
}
.nav-collapse-content.open{
  max-height:220px;
  padding:10px 16px;
  border-top-color:var(--border);
}

.mode-bar{display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.mode-btn{
  font-size:10px; font-weight:700;
  padding:4px 10px;
  border-radius:var(--radius-full);
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-muted);
  transition:all var(--t-base);
  text-transform:uppercase;
}
.mode-btn.active{
  background:var(--btn-bg);
  border-color:transparent;
  color:#fff;
  box-shadow:0 4px 12px rgba(168,85,247,.4);
}

.seed-bar{
  display:flex; gap:6px; justify-content:center; align-items:center;
  font-size:10px; color:var(--text-dim);
}
.seed-display{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  padding:2px 8px;
  background:var(--surface);
  border-radius:var(--radius-full);
  border:1px solid var(--border);
  cursor:pointer;
  transition:background var(--t-base);
  color:var(--text);
  font-size:10px;
}
.seed-display:hover{background:var(--surface-hover)}
.seed-display.copied{background:rgba(74,222,128,.2); border-color:rgba(74,222,128,.5)}

.modifier-bar{display:flex; gap:4px; justify-content:center; flex-wrap:wrap}
.mod-pill{
  font-size:9px; font-weight:700;
  padding:2px 8px;
  border-radius:var(--radius-full);
  background:rgba(168,85,247,.15);
  border:1px solid rgba(168,85,247,.4);
  color:var(--text-muted);
  text-transform:uppercase;
}

.level-selector-wrapper{
  display:flex; align-items:center; gap:6px;
  padding:6px 12px;
  justify-content:center;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.level-selector-arrow{
  width:30px; height:30px; flex-shrink:0;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text); font-size:14px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:all var(--t-base);
}
.level-selector-arrow:hover:not(:disabled){background:var(--surface-hover)}
.level-selector-arrow:disabled{opacity:.35; cursor:not-allowed}
.level-selector{
  display:flex; gap:6px;
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none;
  scroll-behavior:smooth;
  flex:1; max-width:100%;
  padding:2px 4px;
}
.level-selector::-webkit-scrollbar{display:none}

.level-btn{
  min-width:34px; height:34px;
  border-radius:var(--radius-md);
  background:var(--surface);
  border:2px solid var(--border);
  font-size:11px; font-weight:700;
  flex-shrink:0; position:relative; color:var(--text);
  transition:all var(--t-base);
}
.level-btn.active{
  background:var(--btn-bg); border-color:transparent;
  box-shadow:var(--glow-purple); color:#fff;
}
.level-btn.completed::after{
  content:'✓'; position:absolute; top:-2px; right:2px;
  color:var(--success); font-size:8px; font-weight:800;
}

.game-area{
  flex:1;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:10px; gap:10px;
  overflow:hidden;
  min-height:0;
}
.tubes-container{
  display:flex; flex-wrap:wrap;
  gap:10px 6px;
  max-width:100%; width:100%;
  justify-content:center; align-items:end;
}

.tube{
  position:relative;
  width:var(--tw,40px);
  height:var(--th,170px);
  background:var(--tube-bg);
  border:2px solid var(--tube-border);
  border-top:none;
  border-radius:0 0 20px 20px;
  box-shadow:var(--tube-shadow);
  display:flex; flex-direction:column-reverse; align-items:center;
  padding:4px 4px 0;
  cursor:pointer;
  transition:transform var(--t-base), filter var(--t-base);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  overflow:hidden;
}
.tube::before{
  content:''; position:absolute;
  top:0; left:4px; right:4px; height:8px;
  background:linear-gradient(to bottom,rgba(255,255,255,.3),transparent);
  border-radius:0 0 50% 50%;
  pointer-events:none; z-index:5;
}
.tube:not(.complete):not(.selected):hover{transform:translateY(-3px)}
.tube.selected{transform:translateY(-10px); filter:drop-shadow(var(--glow-purple))}
.tube.destination{filter:drop-shadow(var(--glow-green))}
.tube.complete{border-color:var(--success); filter:drop-shadow(0 0 10px rgba(74,222,128,.5))}
.tube.complete::after{
  content:'✓'; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
  color:var(--success); font-size:12px; font-weight:800;
}
.tube.invalid{animation:shake .35s cubic-bezier(.36,.07,.19,.97)}
.tube.hint{filter:drop-shadow(0 0 14px var(--glow-gold)); animation:hintPulse .6s ease-in-out 2}
@keyframes hintPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

.ball{
  width:var(--bw,30px); height:var(--bw,30px);
  border-radius:50%; margin-bottom:2px;
  position:relative;
  box-shadow:inset -2px -2px 6px rgba(0,0,0,.4),inset 2px 2px 6px rgba(255,255,255,.4),0 2px 5px rgba(0,0,0,.4);
  flex-shrink:0;
}
.ball.animated{animation:ballDrop .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes ballDrop{from{transform:translateY(-15px) scale(.8); opacity:0}to{transform:translateY(0) scale(1); opacity:1}}
.ball::before{
  content:''; position:absolute; top:12%; left:18%; width:30%; height:30%;
  border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);
  pointer-events:none;
}
.ball.red{background:radial-gradient(circle at 35% 30%,#ff6b6b,#dc2626 60%,#991b1b)}
.ball.green{background:radial-gradient(circle at 35% 30%,#86efac,#22c55e 60%,#15803d)}
.ball.blue{background:radial-gradient(circle at 35% 30%,#93c5fd,#3b82f6 60%,#1e40af)}
.ball.yellow{background:radial-gradient(circle at 35% 30%,#fde68a,#eab308 60%,#a16207)}
.ball.purple{background:radial-gradient(circle at 35% 30%,#d8b4fe,#a855f7 60%,#6b21a8)}
.ball.orange{background:radial-gradient(circle at 35% 30%,#fdba74,#f97316 60%,#c2410c)}
.ball.pink{background:radial-gradient(circle at 35% 30%,#f9a8d4,#ec4899 60%,#9d174d)}
.ball.cyan{background:radial-gradient(circle at 35% 30%,#a5f3fc,#06b6d4 60%,#0e7490)}
.ball.brown{background:radial-gradient(circle at 35% 30%,#d6b896,#8b5a2b 60%,#5a3a17)}
.ball.gray{background:radial-gradient(circle at 35% 30%,#d4d4d8,#71717a 60%,#3f3f46)}
.ball.lime{background:radial-gradient(circle at 35% 30%,#d9f99d,#84cc16 60%,#3f6212)}
.ball.teal{background:radial-gradient(circle at 35% 30%,#99f6e4,#14b8a6 60%,#0f766e)}
.ball.magenta{background:radial-gradient(circle at 35% 30%,#f0abfc,#d946ef 60%,#86198f)}
.ball.rainbow{background:conic-gradient(from 0deg,#ff6b6b, #fde68a, #86efac, #93c5fd, #d8b4fe, #f9a8d4, #ff6b6b); animation:rainbowSpin 4s linear infinite;}
@keyframes rainbowSpin{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
.ball.blind{background:radial-gradient(circle at 35% 30%,#4a4a4a,#1a1a1a 60%,#000)}
.ball.blind::after{content:'?'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fbbf24; font-weight:900; font-size:14px;}

.bottom-bar{
  display:flex; justify-content:center; gap:8px;
  padding:10px 16px; flex-wrap:wrap;
  background:var(--surface);
  border-top:1px solid var(--border);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.btn{
  padding:9px 14px;
  border-radius:var(--radius-full);
  background:var(--btn-bg);
  color:#fff; font-size:11px; font-weight:700;
  display:inline-flex; align-items:center; gap:5px;
  transition:all var(--t-base);
  box-shadow:0 4px 14px rgba(168,85,247,.4);
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.secondary{background:var(--btn-accent); box-shadow:0 4px 14px rgba(59,130,246,.4)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c); box-shadow:0 4px 14px rgba(239,68,68,.4)}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none!important; box-shadow:none!important}
.btn.full{width:100%; justify-content:center}

.zen-toggle{
  display:flex; align-items:center; gap:5px;
  font-size:11px; font-weight:600; color:var(--text-muted);
  padding:7px 12px; background:var(--surface); border-radius:var(--radius-full);
  border:1px solid var(--border);
  transition:all var(--t-base);
}
.zen-toggle.active{background:rgba(74,222,128,.2); border-color:rgba(74,222,128,.5); color:var(--success)}

.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:20px; opacity:0; pointer-events:none; transition:opacity var(--t-base);
}
.modal-overlay.active{opacity:1; pointer-events:auto}
.modal-card{
  background:linear-gradient(135deg,rgba(45,27,78,.98),rgba(26,11,46,.98));
  border:1px solid rgba(168,85,247,.4); border-radius:var(--radius-xl);
  padding:24px 20px; max-width:360px; width:100%; text-align:center;
  box-shadow:var(--shadow-lg); transform:scale(.9); transition:transform var(--t-slow);
}
.modal-overlay.active .modal-card{transform:scale(1)}
.modal-emoji{font-size:48px; margin-bottom:8px}
.modal-title{font-size:20px; font-weight:800; margin:0 0 6px; color:var(--accent-1)}
.modal-message{color:var(--text-muted); font-size:12px; margin:0 0 16px}
.modal-stats{
  display:flex; justify-content:space-around;
  padding:12px; background:rgba(168,85,247,.1);
  border-radius:var(--radius-md); margin-bottom:16px;
}
.modal-stat-value{font-size:18px; font-weight:800; color:var(--accent-1)}
.modal-stat-label{font-size:9px; text-transform:uppercase; color:var(--text-muted)}

.toast-container{
  position:fixed; top:65px; left:50%; transform:translateX(-50%);
  z-index:2000; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;
}
.toast{
  color:#fff; padding:8px 16px; border-radius:var(--radius-full);
  font-weight:700; font-size:11px; box-shadow:var(--shadow-md); animation:toastIn .3s ease;
  max-width:90vw; text-align:center;
}
.toast.info{background:linear-gradient(135deg,var(--accent-1),var(--accent-2))}
.toast.warn{background:linear-gradient(135deg,var(--warning),#d97706)}
.toast.success{background:linear-gradient(135deg,var(--success),#15803d)}
@keyframes toastIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}

.exit-screen{
  position:fixed; inset:0; z-index:5000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%,var(--bg-2),var(--bg-3));
  color:var(--text);
  text-align:center; padding:24px; gap:14px;
  animation:exitFadeIn var(--t-slow);
}
@keyframes exitFadeIn{from{opacity:0}to{opacity:1}}
.exit-screen h1{font-size:28px; margin:0; font-weight:800}
.exit-screen p{color:var(--text-muted); margin:0; font-size:14px}
.exit-screen .btn{padding:12px 24px; font-size:13px}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-top-row">
    <div class="nav-actions">
      <button class="btn-icon" id="btn-theme" type="button" aria-label="Alternar tema" title="Tema">🌙</button>
      <button class="btn-icon" id="btn-sound" type="button" aria-label="Alternar som" title="Som">🔊</button>
      <button class="btn-icon btn-install" id="btn-install" type="button" aria-label="Instalar aplicativo" title="Instalar como app" hidden>⬇️</button>
    </div>
    <div class="stats" role="status" aria-live="polite">
      <div class="stat"><div class="stat-value" id="stat-moves">0</div><div class="stat-label">Movs</div></div>
      <div class="stat"><div class="stat-value" id="stat-level">1</div><div class="stat-label">Nível</div></div>
      <div class="stat"><div class="stat-value" id="stat-colors">0</div><div class="stat-label">Cores</div></div>
    </div>
    <button class="btn-icon" id="btn-restart" type="button" aria-label="Reiniciar nível" title="Reiniciar">🔄</button>
  </div>

  <button class="nav-dropdown-toggle" id="btn-toggle-options" type="button" aria-expanded="false" aria-controls="options-panel">
    <span>⚙️ Opções e Modos do Jogo</span>
    <span id="options-chevron" aria-hidden="true">▼</span>
  </button>

  <div class="nav-collapse-content" id="options-panel">
    <nav class="mode-bar" id="mode-bar" aria-label="Modo de jogo"></nav>
    <div class="seed-bar">
      <span>SEED:</span>
      <button type="button" class="seed-display" id="seed-display" title="Clique para copiar link">—</button>
      <button class="btn-icon" id="btn-shuffle-seed" style="width:22px;height:22px;font-size:10px" title="Nova seed">🎲</button>
    </div>
    <div class="modifier-bar" id="modifier-bar"></div>
  </div>
</header>

<div class="level-selector-wrapper" id="level-selector-wrapper">
  <button class="level-selector-arrow" id="level-prev" type="button" aria-label="Nível anterior">‹</button>
  <nav class="level-selector" id="level-selector" aria-label="Seleção de nível"></nav>
  <button class="level-selector-arrow" id="level-next" type="button" aria-label="Próximo nível">›</button>
</div>

<main class="game-area">
  <div class="tubes-container" id="tubes-container" role="grid" aria-label="Tabuleiro"></div>
</main>

<footer class="bottom-bar">
  <button class="btn secondary" id="btn-undo" type="button" title="Desfazer (Ctrl+Z)" disabled>↶</button>
  <button class="btn secondary" id="btn-hint" type="button" title="Dica (H)">💡</button>
  <button class="btn secondary" id="btn-add-tube" type="button" title="Adicionar Tubo (T)">➕</button>
  <button class="zen-toggle" id="btn-zen" type="button" aria-pressed="false">🧘 Zen</button>
  <button class="btn danger" id="btn-exit" type="button" title="Sair do jogo">🚪 Sair</button>
</footer>

<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-emoji">🎉</div>
    <h2 class="modal-title" id="modal-title">Nível Completo!</h2>
    <p class="modal-message" id="modal-message">Parabéns! Conseguiste ordenar todas as bolas.</p>
    <div class="modal-stats">
      <div><div class="modal-stat-value" id="modal-moves">0</div><div class="modal-stat-label">Movs</div></div>
      <div><div class="modal-stat-value" id="modal-level">1</div><div class="modal-stat-label">Nível</div></div>
      <div><div class="modal-stat-value" id="modal-time">0s</div><div class="modal-stat-label">Tempo</div></div>
    </div>
    <button class="btn full" id="btn-next-level" type="button">▶️ Próximo Nível</button>
  </div>
</div>

<div class="toast-container" id="toast-container" aria-live="polite"></div>

<script>
/* ============================================================
   BALL SORT PUZZLE v8.2 — PWA Ready + Melhorias
   ============================================================ */
'use strict';

const CONFIG = Object.freeze({
  COLORS: ['red','green','blue','yellow','purple','orange','pink','cyan','brown','gray','lime','teal','magenta'],
  MAX_LEVEL: 30,
  MAX_EXTRA_TUBES: 2,
  MAX_HISTORY: 100,
  MAX_GENERATION_RETRIES: 5,
  TOAST_DURATION: 1800,
  TOAST_SAFETY_TIMEOUT: 5000,
  WIN_MODAL_DELAY: 400,
  SAVE_DEBOUNCE: 400,
  RESIZE_DEBOUNCE: 150,
  STUCK_CHECK_DELAY: 300,
  SIZING: Object.freeze({
    TUBE_BALL_GAP: 10,
    TUBE_HEIGHT_PADDING: 12,
    BALL_MIN: 16,
    BALL_MAX: 38,
    AVAIL_H_RATIO: 0.45,
    AVAIL_W_MAX: 900,
    AVAIL_W_RATIO: 0.95,
    MIN_TUBES_PER_ROW: 4,
    TUBE_MIN_WIDTH: 50
  }),
  STORAGE_KEYS: Object.freeze({
    THEME: 'ballsort.theme',
    LEVEL: 'ballsort.level',
    COMPLETED: 'ballsort.completed',
    SAVE: 'ballsort.save',
    SOUND: 'ballsort.sound',
    MODE: 'ballsort.mode',
    SEED: 'ballsort.seed'
  })
});

/* ---------- Utilitários ---------- */
class SeededRandom {
  constructor(seed) { this._state = (seed | 0) >>> 0; }
  next() {
    let t = (this._state += 0x6D2B79F5) >>> 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(min, max) { return Math.floor(this.next() * (max - min + 1)) + min; }
  pick(arr) { return arr[this.int(0, arr.length - 1)]; }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.int(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  weighted(items) {
    const total = items.reduce((s, it) => s + it.weight, 0);
    let r = this.next() * total;
    for (const it of items) {
      r -= it.weight;
      if (r <= 0) return it.item;
    }
    return items[items.length - 1].item;
  }
}

const SeedUtils = {
  fromString(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  },
  toString(seed) { return (seed >>> 0).toString(36).toUpperCase().padStart(6, '0'); },
  fromURL() {
    const m = location.hash.match(/seed=([A-Z0-9]+)/i);
    return m ? parseInt(m[1], 36) >>> 0 : null;
  },
  toURL(seed) {
    const s = SeedUtils.toString(seed);
    try { history.replaceState(null, '', `#seed=${s}`); } catch {}
  },
  clearURLHash() {
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  },
  daily() {
    const d = new Date();
    return SeedUtils.fromString(`daily-${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`);
  },
  random() { return (Math.random() * 0xFFFFFFFF) >>> 0; }
};

const QueryUtils = {
  getMode() {
    try {
      const params = new URLSearchParams(location.search);
      const mode = params.get('mode');
      return mode && ['classic','challenge','chaos','daily'].includes(mode) ? mode : null;
    } catch { return null; }
  }
};

const EventBus = (() => {
  const listeners = new Map();
  return {
    on(event, handler) {
      if (!listeners.has(event)) listeners.set(event, new Set());
      listeners.get(event).add(handler);
      return () => listeners.get(event).delete(handler);
    },
    emit(event, payload) {
      const set = listeners.get(event);
      if (!set) return;
      set.forEach(fn => {
        try { fn(payload); } catch (e) { console.error(`[EventBus:${event}]`, e); }
      });
    }
  };
})();

const Storage = {
  get(key, fallback = null) {
    try { const raw = localStorage.getItem(key); return raw === null ? fallback : raw; }
    catch { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, String(value)); } catch {} },
  getJSON(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
    catch { return fallback; }
  },
  setJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  remove(key) { try { localStorage.removeItem(key); } catch {} }
};

/* ---------- Áudio ---------- */
const Sound = (() => {
  let ctx = null;
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.SOUND, '1') === '1';
  let muted = false;

  const ensure = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  };

  const tone = (freq, type, duration, volume) => {
    if (!enabled || muted) return;
    const ac = ensure(); if (!ac) return;
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(now); osc.stop(now + duration);
  };

  return {
    isEnabled: () => enabled,
    isMuted: () => muted,
    setMuted: (m) => { muted = m; },
    toggle() {
      enabled = !enabled;
      Storage.set(CONFIG.STORAGE_KEYS.SOUND, enabled ? '1' : '0');
      if (enabled) tone(880, 'sine', .1, .1);
      return enabled;
    },
    select() { tone(600, 'sine', .08, .06); },
    move() { tone(400, 'triangle', .12, .08); },
    invalid() { tone(180, 'sawtooth', .15, .06); },
    win() {
      if (!enabled || muted) return;
      const ac = ensure(); if (!ac) return;
      const now = ac.currentTime;
      [523, 659, 784, 1046].forEach((freq, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = freq; o.type = 'sine';
        const t = now + i * .1;
        g.gain.setValueAtTime(.001, t);
        g.gain.exponentialRampToValueAtTime(.12, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + .35);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + .35);
      });
    }
  };
})();

/* ---------- Toaster ---------- */
const Toaster = (() => {
  const container = document.getElementById('toast-container');
  const queue = [];
  let active = false;

  const show = ({ msg, type }) => {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      el.remove();
      active = false;
      next();
    };
    setTimeout(finish, CONFIG.TOAST_DURATION);
    setTimeout(finish, CONFIG.TOAST_SAFETY_TIMEOUT);
  };

  const next = () => {
    if (active || queue.length === 0) return;
    active = true;
    show(queue.shift());
  };

  const enqueue = (msg, type) => { queue.push({ msg, type }); next(); };

  return {
    info: (msg) => enqueue(msg, 'info'),
    warn: (msg) => enqueue(msg, 'warn'),
    success: (msg) => enqueue(msg, 'success')
  };
})();

/* ---------- Domínio ---------- */
const GameModes = {
  classic:   { id: 'classic',   label: 'Clássico', icon: '🎯', noUndo: false, noExtraTube: false, chaos: false },
  challenge: { id: 'challenge', label: 'Desafio',  icon: '⚔️', noUndo: true,  noExtraTube: true,  chaos: false },
  chaos:     { id: 'chaos',     label: 'Caos',     icon: '🎲', noUndo: false, noExtraTube: false, chaos: true },
  daily:     { id: 'daily',     label: 'Diário',   icon: '📅', noUndo: false, noExtraTube: false, chaos: false, useDailySeed: true }
};

const Palettes = {
  classic: { colors: ['red','green','blue','yellow','purple','orange','pink','cyan','brown','gray','lime','teal','magenta'] },
  warm:    { colors: ['red','orange','yellow','pink','magenta'] },
  cool:    { colors: ['blue','cyan','green','purple','teal'] },
  earth:   { colors: ['brown','gray','lime','yellow','orange'] },
  neon:    { colors: ['pink','cyan','lime','magenta','purple'] }
};

const RAINBOW = '__RAINBOW__';

const Rules = {
  isRainbow(color) { return color === RAINBOW; },
  top(tube) { return tube.length ? tube[tube.length - 1] : null; },

  // v8.2: rainbow é curinga. Tubo só é completo se todo mundo for a mesma cor
  // OU se houver rainbow que se adapta — mas rainbow puro (sem cor base) NÃO é completo.
  isComplete(tube, bpt) {
    if (tube.length === 0 || tube.length !== bpt) return false;
    const nonRainbow = tube.filter(c => !Rules.isRainbow(c));
    if (nonRainbow.length === 0) return false; // só rainbows = não resolvido
    const first = nonRainbow[0];
    return nonRainbow.every(c => c === first);
  },

  // v8.2: rainbow só vai para vazio, ou sobre rainbow, ou sobre tubo com mesma cor real.
  // Uma bola colorida só vai sobre rainbow se destiver sem conflito.
  canPlace(dest, color, bpt) {
    if (dest.length >= bpt) return false;
    if (dest.length === 0) return true;
    const topColor = Rules.top(dest);

    // rainbow pousa em rainbow → ok
    if (Rules.isRainbow(topColor) && Rules.isRainbow(color)) return true;

    // rainbow pousa em tubo não-completo (adapta-se à cor do fundo)
    if (Rules.isRainbow(color)) {
      // só permite se o topo não é rainbow (senão mistura) e dest não está completo
      if (Rules.isRainbow(topColor)) return true;
      // evita colocar rainbow sobre tubo já completo (não faz sentido)
      if (Rules.isComplete(dest, bpt)) return false;
      // válido se o tubo já é uniforme (rainbow "se pinta" dessa cor)
      const first = dest[0];
      if (Rules.isRainbow(first)) return true;
      return dest.every(c => c === first || Rules.isRainbow(c));
    }

    // cor real sobre rainbow → ok (rainbow se adapta)
    if (Rules.isRainbow(topColor)) {
      // mas se o tubo já é "de outra cor" (tem não-rainbow diferente), não permite
      const nonRainbow = dest.filter(c => !Rules.isRainbow(c));
      if (nonRainbow.length === 0) return true;
      return nonRainbow.every(c => c === color);
    }

    return topColor === color;
  },

  allSolved(tubes, bpt) { return tubes.every(t => t.length === 0 || Rules.isComplete(t, bpt)); },
  hasAnyBall(tubes) { return tubes.some(t => t.length > 0); },
  hasAnyMove(tubes, bpt) {
    for (let from = 0; from < tubes.length; from++) {
      const src = tubes[from];
      if (src.length === 0 || Rules.isComplete(src, bpt)) continue;
      const color = Rules.top(src);
      for (let to = 0; to < tubes.length; to++) {
        if (from !== to && Rules.canPlace(tubes[to], color, bpt)) return true;
      }
    }
    return false;
  }
};

const DifficultyCurve = {
  compute(level, mode, rng) {
    const baseColors = 4 + Math.floor((level - 1) * 0.7);
    const isSpike = level % 5 === 0 && level >= 5;
    const spikeBonus = isSpike ? 2 : 0;
    const numColors = Math.min(13, baseColors + spikeBonus);

    const ballWeighted = rng.weighted([
      { item: 3, weight: level < 3 ? 0 : 1 },
      { item: 4, weight: 6 },
      { item: 5, weight: level < 4 ? 1 : 3 },
      { item: 6, weight: level < 8 ? 0 : 2 }
    ]);

    const emptyTubes = isSpike ? 1 : rng.weighted([
      { item: 1, weight: level < 3 ? 0 : 2 },
      { item: 2, weight: 5 },
      { item: 3, weight: level < 5 ? 0 : 2 }
    ]);

    const paletteKeys = mode.chaos ? ['classic','warm','cool','earth','neon'] : ['classic','warm','cool','earth'];
    const palette = rng.pick(paletteKeys);
    const reverseMultiplier = 8 + Math.floor(level * 0.5) + (isSpike ? 6 : 0);

    const modifiers = [];
    if (mode.chaos) {
      if (numColors >= 6 && rng.next() < 0.5) modifiers.push('blind');
      if (numColors >= 5 && rng.next() < 0.4) modifiers.push('rainbow');
    } else {
      if (level >= 8 && rng.next() < 0.15) modifiers.push('blind');
      if (level >= 6 && rng.next() < 0.2) modifiers.push('rainbow');
    }

    return { numColors, ballsPerTube: ballWeighted, emptyTubes, palette, isSpike, reverseMultiplier, modifiers };
  }
};

const LevelGenerator = (() => {
  const isSolved = (tubes) => tubes.every(t => t.length === 0 || t.every(c => c === t[0]));

  const validReverseMoves = (tubes, bpt, last) => {
    const moves = [];
    for (let from = 0; from < tubes.length; from++) {
      if (tubes[from].length === 0) continue;
      const color = tubes[from][tubes[from].length - 1];
      if (color === RAINBOW) continue;
      for (let to = 0; to < tubes.length; to++) {
        if (from === to || tubes[to].length >= bpt) continue;
        if (tubes[to].length > 0) {
          const top = tubes[to][tubes[to].length - 1];
          if (top !== color && top !== RAINBOW) continue;
        }
        if (last && last.from === to && last.to === from) continue;
        moves.push({ from, to });
      }
    }
    return moves;
  };

  const shuffleBalls = (tubes, rng) => {
    const allBalls = tubes.flat();
    for (let i = allBalls.length - 1; i > 0; i--) {
      const j = rng.int(0, i);
      [allBalls[i], allBalls[j]] = [allBalls[j], allBalls[i]];
    }
    const bpt = tubes[0].length;
    const result = [];
    for (let i = 0; i < allBalls.length; i += bpt) {
      result.push(allBalls.slice(i, i + bpt));
    }
    return result;
  };

  const buildOnce = (level, modeId, seed) => {
    const mode = GameModes[modeId] || GameModes.classic;
    const rng = new SeededRandom(seed);
    const diff = DifficultyCurve.compute(level, mode, rng);
    const { numColors, ballsPerTube: bpt, emptyTubes, palette, isSpike, reverseMultiplier, modifiers } = diff;

    const shuffledPalette = rng.shuffle(Palettes[palette].colors);
    const usedColors = shuffledPalette.slice(0, Math.min(numColors, shuffledPalette.length));

    const full = usedColors.map(c => Array(bpt).fill(c));
    const empty = Array.from({ length: emptyTubes }, () => []);

    if (modifiers.includes('rainbow')) {
      const maxRainbows = Math.min(2, Math.floor(numColors / 3));
      const rainbowCount = rng.int(1, Math.max(1, maxRainbows));
      const usedTubes = new Set();
      for (let i = 0; i < rainbowCount; i++) {
        let idx, attempts = 0;
        do { idx = rng.int(0, full.length - 1); attempts++; }
        while (usedTubes.has(idx) && attempts < 20);
        usedTubes.add(idx);
        full[idx][rng.int(0, bpt - 1)] = RAINBOW;
      }
    }

    let tubes = [...shuffleBalls(full, rng), ...empty];
    const steps = usedColors.length * reverseMultiplier + level * 4;
    let last = null, stuck = 0;
    for (let i = 0; i < steps; i++) {
      const moves = validReverseMoves(tubes, bpt, last);
      if (moves.length === 0) {
        if (++stuck > 5) break;
        continue;
      }
      stuck = 0;
      const m = moves[rng.int(0, moves.length - 1)];
      tubes[m.to].push(tubes[m.from].pop());
      last = m;
    }

    const blindIndices = [];
    if (modifiers.includes('blind')) {
      const candidates = tubes.map((_, i) => i).filter(i => tubes[i].length > 1);
      const blindCount = Math.min(2, Math.floor(candidates.length / 3));
      for (let i = 0; i < blindCount && candidates.length > 0; i++) {
        const pickIdx = rng.int(0, candidates.length - 1);
        blindIndices.push(candidates.splice(pickIdx, 1)[0]);
      }
    }

    return {
      tubes,
      meta: {
        seed, mode: modeId, level, numColors: usedColors.length, ballsPerTube: bpt,
        emptyTubes, palette, isSpike, modifiers, blindIndices, maxBalls: bpt
      }
    };
  };

  const generate = (level, modeId, seed) => {
    for (let attempt = 0; attempt < CONFIG.MAX_GENERATION_RETRIES; attempt++) {
      const result = buildOnce(level, modeId, (seed + attempt) >>> 0);
      if (!(isSolved(result.tubes) && level > 1)) return result;
    }
    return buildOnce(level, modeId, seed);
  };

  return { generate, isSolved };
})();

/* ---------- Estado ---------- */
class GameState {
  constructor() {
    this.level = 1;
    this.moves = 0;
    this.tubes = [];
    this.bpt = 4;
    this.meta = null;
    this.extraTubes = 0;
    this.selected = null;
    this.history = [];
    this.zenMode = false;
    this.completed = false;
    this.startTime = Date.now();
    this.mode = QueryUtils.getMode() || Storage.get(CONFIG.STORAGE_KEYS.MODE, 'classic');
    this.seed = SeedUtils.fromURL() || SeedUtils.random();
    this.completedLevels = Storage.getJSON(CONFIG.STORAGE_KEYS.COMPLETED, []) || [];
    this.theme = Storage.get(CONFIG.STORAGE_KEYS.THEME, 'dark');
  }

  elapsed() { return Math.max(0, Math.round((Date.now() - this.startTime) / 1000)); }

  snapshot() {
    return {
      tubes: this.tubes.map(t => t.slice()),
      moves: this.moves,
      selected: this.selected,
      extraTubes: this.extraTubes,
      completed: this.completed
    };
  }
  pushHistory() {
    this.history.push(this.snapshot());
    if (this.history.length > CONFIG.MAX_HISTORY) this.history.shift();
  }
  popHistory() {
    const snap = this.history.pop();
    if (!snap) return false;
    this.tubes = snap.tubes.map(t => t.slice());
    this.moves = snap.moves;
    this.selected = null;
    this.extraTubes = snap.extraTubes;
    this.completed = false;
    return true;
  }
  markCompleted(level) {
    if (!this.completedLevels.includes(level)) {
      this.completedLevels.push(level);
      Storage.setJSON(CONFIG.STORAGE_KEYS.COMPLETED, this.completedLevels);
    }
  }
  saveLevel() { Storage.set(CONFIG.STORAGE_KEYS.LEVEL, this.level); }
  saveMode() { Storage.set(CONFIG.STORAGE_KEYS.MODE, this.mode); }

  saveGame() {
    Storage.setJSON(CONFIG.STORAGE_KEYS.SAVE, {
      level: this.level, moves: this.moves, tubes: this.tubes, bpt: this.bpt,
      meta: this.meta, extraTubes: this.extraTubes, history: this.history.slice(-20),
      mode: this.mode, seed: this.seed, startTime: this.startTime
    });
  }
  loadSavedGame() {
    const save = Storage.getJSON(CONFIG.STORAGE_KEYS.SAVE, null);
    if (!save || !Array.isArray(save.tubes) || save.tubes.length === 0) return false;
    this.level = save.level || 1;
    this.moves = save.moves || 0;
    this.tubes = save.tubes;
    this.bpt = save.bpt || 4;
    this.meta = save.meta || null;
    this.extraTubes = save.extraTubes || 0;
    this.history = save.history || [];
    this.mode = QueryUtils.getMode() || save.mode || 'classic';
    this.seed = save.seed || SeedUtils.random();
    this.selected = null;
    this.completed = false;
    // v8.2: restaura startTime do save
    this.startTime = save.startTime || Date.now();
    return true;
  }
  clearSave() { Storage.remove(CONFIG.STORAGE_KEYS.SAVE); }
}

/* ---------- Controller ---------- */
class GameController {
  constructor(state) {
    this.state = state;
    this._saveDebounceId = null;
    this._stuckTimerId = null;
  }

  getMode() { return GameModes[this.state.mode] || GameModes.classic; }

  _scheduleSave() {
    clearTimeout(this._saveDebounceId);
    this._saveDebounceId = setTimeout(() => this.state.saveGame(), CONFIG.SAVE_DEBOUNCE);
  }

  _clearStuckTimer() {
    if (this._stuckTimerId) {
      clearTimeout(this._stuckTimerId);
      this._stuckTimerId = null;
    }
  }

  loadLevel(level, { silent = false, seed = null, clearHash = false } = {}) {
    const s = this.state;
    const mode = this.getMode();

    if (mode.useDailySeed) seed = SeedUtils.daily();
    else if (seed === null) seed = SeedUtils.random();

    s.level = level;
    s.moves = 0;
    s.seed = seed;
    s.startTime = Date.now();
    this._clearStuckTimer();

    const generated = LevelGenerator.generate(level, s.mode, seed);
    s.tubes = generated.tubes;
    s.meta = generated.meta;
    s.bpt = generated.meta.ballsPerTube;
    s.extraTubes = 0;
    s.selected = null;
    s.history = [];
    s.completed = false;

    if (!silent) {
      s.saveLevel();
      s.saveGame();
      SeedUtils.toURL(seed);
      // v8.2: limpa hash se veio de link externo (evita "grudar" seed)
      if (clearHash) SeedUtils.clearURLHash();
    }
    EventBus.emit('state:changed');
    EventBus.emit('level:loaded', { level, meta: s.meta, seed });
  }

  restart() {
    this.loadLevel(this.state.level, { silent: true, seed: this.state.seed });
    EventBus.emit('toast:info', 'Nível reiniciado');
  }

  setMode(modeId) {
    if (!GameModes[modeId]) return;
    this.state.mode = modeId;
    this.state.saveMode();
    EventBus.emit('mode:changed', modeId);
    this.loadLevel(this.state.level);
    EventBus.emit('toast:info', `${GameModes[modeId].icon} ${GameModes[modeId].label}`);
  }

  newSeed() {
    this.loadLevel(this.state.level, { seed: SeedUtils.random() });
    EventBus.emit('toast:info', '🎲 Nova seed');
  }

  selectTube(idx) {
    const s = this.state;
    if (s.completed) return;
    if (!s.tubes[idx]) return;

    if (s.selected === idx) {
      s.selected = null;
      EventBus.emit('state:changed');
      return;
    }

    if (s.selected !== null) {
      if (this.tryMove(s.selected, idx)) return;
      const target = s.tubes[idx];
      if (target.length > 0 && !Rules.isComplete(target, s.bpt)) {
        s.selected = idx;
        Sound.select();
      } else {
        s.selected = null;
        EventBus.emit('tube:invalid', idx);
      }
      EventBus.emit('state:changed');
      return;
    }

    const tube = s.tubes[idx];
    if (tube.length === 0 || Rules.isComplete(tube, s.bpt)) {
      EventBus.emit('tube:invalid', idx);
      return;
    }
    s.selected = idx;
    Sound.select();
    EventBus.emit('state:changed');
  }

  tryMove(fromIdx, toIdx) {
    const s = this.state;
    const from = s.tubes[fromIdx];
    const to = s.tubes[toIdx];

    if (Rules.isComplete(from, s.bpt)) {
      Toaster.warn('Este tubo já está completo');
      s.selected = null;
      EventBus.emit('state:changed');
      return false;
    }
    if (from.length === 0) {
      s.selected = null;
      EventBus.emit('state:changed');
      return false;
    }

    const color = Rules.top(from);
    if (!Rules.canPlace(to, color, s.bpt)) {
      Sound.invalid();
      EventBus.emit('tube:invalid', toIdx);
      return false;
    }

    // v8.2: simula primeiro para só push no histórico se houver movimento
    const fromCopy = from.slice();
    const toCopy = to.slice();
    let count = 0;
    while (fromCopy.length > 0 && Rules.top(fromCopy) === color && Rules.canPlace(toCopy, color, s.bpt)) {
      toCopy.push(fromCopy.pop());
      count++;
    }
    if (count === 0) {
      s.selected = null;
      EventBus.emit('state:changed');
      return false;
    }

    s.pushHistory();
    s.tubes[fromIdx] = fromCopy;
    s.tubes[toIdx] = toCopy;

    s.moves++;
    Sound.move();
    EventBus.emit('ball:moved', { count });
    s.selected = null;
    this.checkWin();
    this._scheduleSave();

    this._clearStuckTimer();
    this._stuckTimerId = setTimeout(() => {
      this._stuckTimerId = null;
      if (!s.completed && Rules.hasAnyBall(s.tubes) && !Rules.hasAnyMove(s.tubes, s.bpt)) {
        EventBus.emit('game:stuck');
      }
    }, CONFIG.STUCK_CHECK_DELAY);

    EventBus.emit('state:changed');
    return true;
  }

  checkWin() {
    const s = this.state;
    if (!Rules.allSolved(s.tubes, s.bpt) || !Rules.hasAnyBall(s.tubes)) return;
    s.completed = true;
    s.markCompleted(s.level);
    s.clearSave();
    this._clearStuckTimer();
    Sound.win();
    EventBus.emit('level:won', {
      level: s.level,
      moves: s.moves,
      time: s.elapsed()
    });
  }

  undo() {
    if (this.getMode().noUndo) { Toaster.warn('Desafio não permite desfazer'); return; }
    if (this.state.history.length === 0) { Toaster.info('Nada para desfazer'); return; }
    this._clearStuckTimer();
    this.state.popHistory();
    Sound.select();
    this._scheduleSave();
    EventBus.emit('state:changed');
  }

  addExtraTube() {
    if (this.getMode().noExtraTube) { Toaster.warn('Desafio não permite tubo extra'); return; }
    const s = this.state;
    if (s.extraTubes >= CONFIG.MAX_EXTRA_TUBES) {
      Toaster.warn(`Máximo de ${CONFIG.MAX_EXTRA_TUBES} tubos extras`);
      return;
    }
    s.pushHistory();
    s.tubes.push([]);
    s.extraTubes++;
    Sound.select();
    this._scheduleSave();
    EventBus.emit('state:changed');
  }

  toggleZen() {
    this.state.zenMode = !this.state.zenMode;
    Sound.setMuted(this.state.zenMode);
    EventBus.emit('zen:toggled', this.state.zenMode);
    Toaster.info(this.state.zenMode ? '🧘 Modo Zen ativado — foco total' : 'Modo Zen desativado');
  }

  hint() {
    if (this.state.zenMode) { Toaster.info('🧘 Zen mode: dicas desativadas'); return; }
    const s = this.state;
    s.selected = null;

    const nonEmpties = [];
    const empties = [];
    for (let from = 0; from < s.tubes.length; from++) {
      const src = s.tubes[from];
      if (src.length === 0 || Rules.isComplete(src, s.bpt)) continue;
      const color = Rules.top(src);
      for (let to = 0; to < s.tubes.length; to++) {
        if (from === to) continue;
        if (!Rules.canPlace(s.tubes[to], color, s.bpt)) continue;
        // evita sugerir mover para tubo vazio se já há um não-vazio válido
        if (s.tubes[to].length === 0) empties.push({ from, to });
        else nonEmpties.push({ from, to });
      }
    }
    const pick = nonEmpties[0] || empties[0];
    if (pick) EventBus.emit('hint:show', pick);
    else Toaster.warn('Sem movimentos disponíveis');
  }

  nextLevel() {
    const next = Math.min(this.state.level + 1, CONFIG.MAX_LEVEL);
    this.loadLevel(next);
  }
}

/* ---------- Renderer (com diffing) ---------- */
class Renderer {
  constructor(state) {
    this.state = state;
    this._els = {
      tubes:        document.getElementById('tubes-container'),
      levelSelector:document.getElementById('level-selector'),
      modeBar:      document.getElementById('mode-bar'),
      modifierBar:  document.getElementById('modifier-bar'),
      seedDisplay:  document.getElementById('seed-display'),
      statMoves:    document.getElementById('stat-moves'),
      statLevel:    document.getElementById('stat-level'),
      statColors:   document.getElementById('stat-colors'),
      btnUndo:      document.getElementById('btn-undo'),
      btnAddTube:   document.getElementById('btn-add-tube'),
      btnZen:       document.getElementById('btn-zen'),
      btnTheme:     document.getElementById('btn-theme'),
      btnSound:     document.getElementById('btn-sound'),
      levelPrev:    document.getElementById('level-prev'),
      levelNext:    document.getElementById('level-next'),
      modal:        document.getElementById('modal-overlay'),
      modalMoves:   document.getElementById('modal-moves'),
      modalLevel:   document.getElementById('modal-level'),
      modalTime:    document.getElementById('modal-time')
    };
    this.onTubeClick = null;
    this._lastBallSize = null;
    this._hintTimers = [];
    this._tubeEls = []; // cache de elementos por índice
  }

  bindTubeClick(handler) { this.onTubeClick = handler; }

  render() {
    this.renderTubes();
    this.renderStats();
    this.renderControls();
    this.renderLevelSelector();
    this.renderModeBar();
    this.renderModifierBar();
    this.renderSeed();
    this.renderTheme();
    this.renderZenBody();
  }

  /**
   * v8.2: diffing de tubos.
   * Reaproveita elementos existentes quando possível para evitar flicker das animações.
   * Só recria quando a QUANTIDADE de tubos muda (loadLevel / addTube).
   */
  renderTubes() {
    const s = this.state;
    const maxBalls = s.meta ? s.meta.maxBalls : 6;
    const ballSize = this.computeBallSize(maxBalls, s.tubes.length);
    const tubeH = ballSize * maxBalls + CONFIG.SIZING.TUBE_HEIGHT_PADDING;
    const tubeW = ballSize + CONFIG.SIZING.TUBE_BALL_GAP;

    if (ballSize !== this._lastBallSize) {
      document.documentElement.style.setProperty('--bw', `${ballSize}px`);
      this._lastBallSize = ballSize;
    }

    const selectedOrigin = s.selected !== null ? s.tubes[s.selected] : null;
    const selectedColor = selectedOrigin && selectedOrigin.length && !Rules.isComplete(selectedOrigin, s.bpt)
      ? Rules.top(selectedOrigin) : null;

    const container = this._els.tubes;
    const existing = this._tubeEls;
    const needRecreate = existing.length !== s.tubes.length;

    if (needRecreate) {
      // Recria todos os tubos (mudança estrutural)
      const frag = document.createDocumentFragment();
      this._tubeEls = [];
      s.tubes.forEach((_, idx) => {
        const el = this._createTubeElement(idx);
        this._tubeEls.push(el);
        frag.appendChild(el);
      });
      container.replaceChildren(frag);
    }

    // Atualiza cada tubo individualmente (diffing de bolas)
    s.tubes.forEach((tube, idx) => {
      const el = this._tubeEls[idx];
      el.style.setProperty('--th', `${tubeH}px`);
      el.style.setProperty('--tw', `${tubeW}px`);

      const isBlind = s.meta && s.meta.blindIndices && s.meta.blindIndices.includes(idx);
      const isSelected = s.selected === idx;
      const isComplete = Rules.isComplete(tube, s.bpt);

      el.classList.toggle('selected', isSelected);
      el.classList.toggle('complete', isComplete);
      const isDestination = selectedColor !== null && idx !== s.selected && Rules.canPlace(tube, selectedColor, s.bpt);
      el.classList.toggle('destination', isDestination);

      el.setAttribute('aria-label', `Tubo ${idx + 1}, ${tube.length} bolas${isComplete ? ', completo' : ''}`);

      this._syncBalls(el, tube, { isBlind, isSelected });
    });
  }

  _createTubeElement(idx) {
    const el = document.createElement('div');
    el.className = 'tube';
    el.dataset.index = idx;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.addEventListener('click', () => this.onTubeClick && this.onTubeClick(idx));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.onTubeClick && this.onTubeClick(idx);
      }
    });
    return el;
  }

  /**
   * v8.2: sincroniza apenas as bolas que mudaram.
   * Mantém animação só em bolas NOVAS (evita flicker).
   */
  _syncBalls(tubeEl, tube, { isBlind, isSelected }) {
    const currentBalls = Array.from(tubeEl.children);
    const targetCount = tube.length;

    // Ajusta quantidade
    if (currentBalls.length > targetCount) {
      for (let i = currentBalls.length - 1; i >= targetCount; i--) {
        currentBalls[i].remove();
      }
      currentBalls.length = targetCount;
    } else if (currentBalls.length < targetCount) {
      // adiciona novas bolas com animação
      for (let i = currentBalls.length; i < targetCount; i++) {
        const ball = document.createElement('div');
        ball.className = 'ball animated';
        tubeEl.appendChild(ball);
        currentBalls.push(ball);
      }
    }

    // Atualiza classe de cada bola
    tube.forEach((color, ballIdx) => {
      const ball = currentBalls[ballIdx];
      if (!ball) return;
      const isRainbow = Rules.isRainbow(color);
      const isTop = ballIdx === tube.length - 1;
      // v8.2: blind cobre todas exceto quando o tubo está selecionado (revela para o jogador)
      const hideColor = isBlind && !isSelected;

      let cls = 'ball';
      if (hideColor) cls += ' blind';
      else if (isRainbow) cls += ' rainbow';
      else cls += ` ${color}`;

      if (ball.className !== cls) {
        // preserva .animated apenas na criação
        ball.className = cls;
      }
      // remove animação após primeiro frame para não repetir em re-renders
      if (ball.classList.contains('animated') && ballIdx < tube.length - 1) {
        // já foi renderizada antes, mantém; animação só roda 1x pelo CSS
      }
    });
  }

  computeBallSize(maxBalls, numTubes) {
    const { SIZING } = CONFIG;
    const vh = window.innerHeight;
    const vw = window.innerWidth;
    const availH = vh * SIZING.AVAIL_H_RATIO;
    const availW = Math.min(vw * SIZING.AVAIL_W_RATIO, SIZING.AVAIL_W_MAX);
    const sizeByH = Math.floor((availH - 20) / maxBalls) - 4;
    const perRow = Math.min(numTubes, Math.max(SIZING.MIN_TUBES_PER_ROW, Math.floor(availW / SIZING.TUBE_MIN_WIDTH)));
    const sizeByW = Math.floor((availW / perRow) - CONFIG.SIZING.TUBE_BALL_GAP);
    return Math.max(SIZING.BALL_MIN, Math.min(SIZING.BALL_MAX, Math.min(sizeByH, sizeByW)));
  }

  renderStats() {
    this._els.statMoves.textContent = this.state.moves;
    this._els.statLevel.textContent = this.state.level;
    this._els.statColors.textContent = this.state.meta ? this.state.meta.numColors : 0;
  }

  renderControls() {
    const mode = GameModes[this.state.mode] || GameModes.classic;
    this._els.btnUndo.disabled = this.state.history.length === 0 || mode.noUndo;
    this._els.btnAddTube.disabled = this.state.extraTubes >= CONFIG.MAX_EXTRA_TUBES || mode.noExtraTube;
    this._els.btnZen.classList.toggle('active', this.state.zenMode);
    this._els.btnZen.setAttribute('aria-pressed', String(this.state.zenMode));
    this._els.btnSound.textContent = Sound.isEnabled() ? '🔊' : '🔇';
  }

  renderLevelSelector() {
    const s = this.state;
    const container = this._els.levelSelector;

    if (container.children.length !== CONFIG.MAX_LEVEL) {
      const frag = document.createDocumentFragment();
      for (let i = 1; i <= CONFIG.MAX_LEVEL; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'level-btn';
        btn.textContent = i;
        btn.dataset.level = i;
        frag.appendChild(btn);
      }
      container.replaceChildren(frag);
    }

    for (const btn of container.children) {
      const lvl = Number(btn.dataset.level);
      btn.classList.toggle('active', lvl === s.level);
      btn.classList.toggle('completed', s.completedLevels.includes(lvl));
    }

    const activeBtn = container.querySelector('.level-btn.active');
    if (activeBtn && container.scrollWidth > container.clientWidth) {
      const target = activeBtn.offsetLeft - (container.clientWidth / 2) + (activeBtn.offsetWidth / 2);
      container.scrollTo({ left: target, behavior: 'smooth' });
    }

    this._els.levelPrev.disabled = s.level <= 1;
    this._els.levelNext.disabled = s.level >= CONFIG.MAX_LEVEL;
  }

  renderModeBar() {
    const container = this._els.modeBar;
    if (container.children.length === 0) {
      const frag = document.createDocumentFragment();
      Object.values(GameModes).forEach(mode => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mode-btn';
        btn.dataset.mode = mode.id;
        btn.textContent = `${mode.icon} ${mode.label}`;
        frag.appendChild(btn);
      });
      container.replaceChildren(frag);
    }
    for (const btn of container.children) {
      btn.classList.toggle('active', btn.dataset.mode === this.state.mode);
    }
  }

  renderModifierBar() {
    const meta = this.state.meta;
    const labels = { blind: '🕶️ Cegos', rainbow: '🌈 Rainbow' };
    if (!meta?.modifiers?.length) {
      this._els.modifierBar.replaceChildren();
      return;
    }
    const frag = document.createDocumentFragment();
    meta.modifiers.forEach(m => {
      const span = document.createElement('span');
      span.className = 'mod-pill';
      span.textContent = labels[m] || m;
      frag.appendChild(span);
    });
    this._els.modifierBar.replaceChildren(frag);
  }

  renderSeed() {
    this._els.seedDisplay.textContent = SeedUtils.toString(this.state.seed);
  }

  renderTheme() {
    document.documentElement.setAttribute('data-theme', this.state.theme);
    this._els.btnTheme.textContent = this.state.theme === 'dark' ? '🌙' : '☀️';
  }

  renderZenBody() {
    document.body.classList.toggle('zen-mode', this.state.zenMode);
  }

  flashInvalid(idx) {
    const el = this._tubeEls[idx];
    if (!el) return;
    el.classList.remove('invalid');
    void el.offsetWidth;
    el.classList.add('invalid');
    setTimeout(() => el.classList.remove('invalid'), 400);
  }

  flashHint(from, to) {
    // v8.2: cancela timeouts anteriores para evitar sobreposição
    this._hintTimers.forEach(clearTimeout);
    this._hintTimers = [];

    [from, to].forEach(i => {
      const el = this._tubeEls[i];
      if (!el) return;
      el.classList.remove('hint');
      void el.offsetWidth;
      el.classList.add('hint');
      const tid = setTimeout(() => el.classList.remove('hint'), 1200);
      this._hintTimers.push(tid);
    });
  }

  openModal({ level, moves, time }) {
    this._els.modalMoves.textContent = moves;
    this._els.modalLevel.textContent = level;
    this._els.modalTime.textContent = `${time}s`;
    this._els.modal.classList.add('active');
  }

  closeModal() { this._els.modal.classList.remove('active'); }

  toggleTheme() {
    this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
    Storage.set(CONFIG.STORAGE_KEYS.THEME, this.state.theme);
    this.renderTheme();
  }

  flashSeedCopied() {
    const el = this._els.seedDisplay;
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 800);
  }

  showExitScreen() {
    const screen = document.createElement('div');
    screen.className = 'exit-screen';

    const h1 = document.createElement('h1');
    h1.textContent = '🚪 Jogo Encerrado';

    const p = document.createElement('p');
    p.textContent = 'Obrigado por jogar Ball Sort Puzzle!';

    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.type = 'button';
    btn.textContent = '▶ Jogar Novamente';
    btn.addEventListener('click', () => location.reload());

    screen.append(h1, p, btn);
    document.body.appendChild(screen);
  }
}

/* ---------- PWA Manager ---------- */
const PWA = (() => {
  let deferredPrompt = null;
  const btnInstall = document.getElementById('btn-install');

  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  const hideButton = () => { if (btnInstall) btnInstall.hidden = true; };
  const showButton = () => { if (btnInstall && !isStandalone()) btnInstall.hidden = false; };

  const init = () => {
    if (isStandalone()) { hideButton(); return; }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showButton();
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      hideButton();
      Toaster.success('✅ Ball Sort instalado!');
    });

    btnInstall?.addEventListener('click', async () => {
      if (!deferredPrompt) {
        Toaster.info('Use o menu do navegador para instalar');
        return;
      }
      try {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') Toaster.success('🎉 Instalando...');
        deferredPrompt = null;
        hideButton();
      } catch (err) {
        console.warn('[PWA] prompt falhou:', err);
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err =>
          console.warn('[SW] Falha ao registrar:', err)
        );
      });
    }
  };

  return { init, isStandalone };
})();

/* ---------- Bootstrap ---------- */
(function App() {
  const state = new GameState();
  const controller = new GameController(state);
  const renderer = new Renderer(state);

  const urlMode = QueryUtils.getMode();
  const hadUrlSeed = SeedUtils.fromURL() !== null;
  if (urlMode) {
    state.saveMode();
    try {
      const cleanSearch = location.search.replace(/[?&]mode=[^&]*/g, '').replace(/^&/, '?');
      history.replaceState(null, '', location.pathname + (cleanSearch === '?' ? '' : cleanSearch) + location.hash);
    } catch {}
  }

  PWA.init();
  renderer.bindTubeClick(idx => controller.selectTube(idx));

  EventBus.on('state:changed', () => renderer.render());
  EventBus.on('tube:invalid', idx => renderer.flashInvalid(idx));
  EventBus.on('toast:info', msg => Toaster.info(msg));
  EventBus.on('toast:warn', msg => Toaster.warn(msg));
  EventBus.on('toast:success', msg => Toaster.success(msg));
  EventBus.on('modal:close', () => renderer.closeModal());
  EventBus.on('hint:show', ({ from, to }) => renderer.flashHint(from, to));
  EventBus.on('level:won', ({ level, moves, time }) => {
    setTimeout(() => renderer.openModal({ level, moves, time }), CONFIG.WIN_MODAL_DELAY);
  });

  // v8.2: handler de "stuck" com sugestão
  EventBus.on('game:stuck', () => {
    if (state.completed) return;
    const mode = controller.getMode();
    const canUndo = !mode.noUndo && state.history.length > 0;
    if (canUndo) {
      Toaster.warn('😵 Sem movimentos — a desfazer...');
      setTimeout(() => controller.undo(), 900);
    } else {
      Toaster.warn('😵 Sem movimentos — reiniciando...');
      setTimeout(() => controller.restart(), 1200);
    }
  });

  // Painel de opções
  const optionsBtn = document.getElementById('btn-toggle-options');
  const optionsPanel = document.getElementById('options-panel');
  const chevron = document.getElementById('options-chevron');

  optionsBtn.addEventListener('click', () => {
    const isOpen = optionsPanel.classList.toggle('open');
    optionsBtn.setAttribute('aria-expanded', String(isOpen));
    chevron.textContent = isOpen ? '▲' : '▼';
  });

  document.getElementById('level-selector').addEventListener('click', (e) => {
    const btn = e.target.closest('.level-btn');
    if (btn) controller.loadLevel(Number(btn.dataset.level));
  });

  document.getElementById('mode-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (btn) controller.setMode(btn.dataset.mode);
  });

  document.getElementById('seed-display').addEventListener('click', () => {
    const seedStr = SeedUtils.toString(state.seed);
    const url = `${location.origin}${location.pathname}#seed=${seedStr}`;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => {
          Toaster.success('🔗 Link copiado!');
          renderer.flashSeedCopied();
        })
        .catch(() => Toaster.info(`Seed: ${seedStr}`));
    } else {
      Toaster.info(`Seed: ${seedStr}`);
    }
  });

  const handlers = {
    'btn-shuffle-seed': () => controller.newSeed(),
    'btn-undo':         () => controller.undo(),
    'btn-add-tube':     () => controller.addExtraTube(),
    'btn-zen':          () => controller.toggleZen(),
    'btn-theme':        () => renderer.toggleTheme(),
    'btn-restart':      () => controller.restart(),
    'btn-hint':         () => controller.hint(),
    'btn-sound':        () => { Sound.toggle(); renderer.renderControls(); },
    'btn-next-level':   () => { renderer.closeModal(); controller.nextLevel(); },
    'level-prev':       () => { if (state.level > 1) controller.loadLevel(state.level - 1); },
    'level-next':       () => { if (state.level < CONFIG.MAX_LEVEL) controller.loadLevel(state.level + 1); },
    'btn-exit':         () => {
      state.clearSave();
      renderer.showExitScreen();
    }
  };
  for (const [id, fn] of Object.entries(handlers)) {
    document.getElementById(id)?.addEventListener('click', fn);
  }

  // v8.2: teclado cobre contenteditable
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t.matches('input, textarea') || t.isContentEditable) return;
    const key = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && key === 'z') { e.preventDefault(); controller.undo(); }
    else if (key === 'r') controller.restart();
    else if (key === 't') controller.addExtraTube();
    else if (key === 'h') controller.hint();
    else if (e.key === 'Escape') {
      if (state.selected !== null) {
        state.selected = null;
        EventBus.emit('state:changed');
      } else {
        renderer.closeModal();
      }
    }
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      renderer._lastBallSize = null;
      // Força recriação dos tubos para recalcular tamanhos
      renderer._tubeEls = [];
      renderer.render();
    }, CONFIG.RESIZE_DEBOUNCE);
  });

  renderer.renderTheme();
  renderer.renderModeBar();

  if (state.loadSavedGame()) {
    EventBus.emit('state:changed');
    Toaster.info(`Partida restaurada · Nível ${state.level}`);
    // v8.2: se veio de link com seed, limpa o hash para não "grudar"
    if (hadUrlSeed) SeedUtils.clearURLHash();
  } else {
    const savedLevel = Math.max(1, Math.min(
      CONFIG.MAX_LEVEL,
      parseInt(Storage.get(CONFIG.STORAGE_KEYS.LEVEL, '1'), 10) || 1
    ));
    controller.loadLevel(savedLevel);
  }
})();
</script>
