<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0b2e">
<title>Ball Sort Puzzle — Professional Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg-1:#1a0b2e; --bg-2:#2d1b4e; --bg-3:#0f0520;
  --text:#f5f0ff; --text-muted:#a78bfa; --text-dim:#6b5b8a;
  --surface:rgba(255,255,255,.06);
  --surface-hover:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.15);
  --tube-border:rgba(255,255,255,.85);
  --tube-bg:rgba(255,255,255,.06);
  --tube-shadow:inset 0 0 20px rgba(255,255,255,.15),inset 0 -10px 30px rgba(0,0,0,.4);
  --accent-1:#a855f7; --accent-2:#ec4899; --accent-3:#06b6d4;
  --success:#4ade80; --warning:#f59e0b; --danger:#ef4444;
  --btn-bg:linear-gradient(135deg,#a855f7,#ec4899);
  --btn-accent:linear-gradient(135deg,#06b6d4,#3b82f6);
  --shadow-sm:0 4px 12px rgba(0,0,0,.25);
  --shadow-md:0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --glow-purple:0 0 24px rgba(168,85,247,.55);
  --glow-green:0 0 24px rgba(74,222,128,.55);
  --t-fast:.15s cubic-bezier(.16,1,.3,1);
  --t-base:.25s cubic-bezier(.16,1,.3,1);
  --t-slow:.4s cubic-bezier(.16,1,.3,1);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
  --radius-full:999px;
}
[data-theme="light"]{
  --bg-1:#f5f0ff; --bg-2:#e0e7ff; --bg-3:#ffffff;
  --text:#1a0b2e; --text-muted:#7c3aed; --text-dim:#a89bc4;
  --surface:rgba(30,20,60,.05);
  --surface-hover:rgba(30,20,60,.1);
  --border:rgba(30,20,60,.15);
  --tube-border:rgba(30,20,60,.9);
  --tube-bg:rgba(30,20,60,.04);
  --tube-shadow:inset 0 0 20px rgba(0,0,0,.05),inset 0 -10px 30px rgba(0,0,0,.08);
  --shadow-sm:0 4px 12px rgba(30,20,60,.1);
  --shadow-md:0 8px 24px rgba(30,20,60,.15);
  --shadow-lg:0 16px 48px rgba(30,20,60,.2);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{
  height:100%; margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  color:var(--text);
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent-1);outline-offset:3px;border-radius:var(--radius-sm)}

body{
  background:radial-gradient(circle at 30% 20%,var(--bg-2) 0%,var(--bg-1) 45%,var(--bg-3) 100%);
  display:flex; flex-direction:column; min-height:100dvh;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.top-bar{
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 20px; gap:12px;
}
.top-bar-actions{display:flex; gap:8px}
.btn-icon{
  width:48px; height:48px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  font-size:22px;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--t-base);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.btn-icon:hover{background:var(--surface-hover); transform:translateY(-2px)}
.btn-icon:active{transform:translateY(0) scale(.95)}

.stats{display:flex; gap:20px; align-items:center}
.stat{display:flex; flex-direction:column; align-items:center; gap:2px}
.stat-value{
  font-size:20px; font-weight:800;
  font-variant-numeric:tabular-nums;
  color:var(--text);
}
.stat-label{
  font-size:10px; text-transform:uppercase;
  letter-spacing:1px; color:var(--text-muted); font-weight:600;
}

/* ============================================================
   LEVEL SELECTOR
   ============================================================ */
.level-selector{
  display:flex; gap:8px; padding:12px 20px;
  overflow-x:auto; justify-content:center; flex-wrap:wrap;
  scrollbar-width:none;
}
.level-selector::-webkit-scrollbar{display:none}
.level-btn{
  min-width:44px; height:44px;
  border-radius:var(--radius-md);
  background:var(--surface);
  border:2px solid var(--border);
  font-size:14px; font-weight:700;
  transition:all var(--t-base);
  flex-shrink:0;
}
.level-btn:hover{background:var(--surface-hover); transform:translateY(-2px)}
.level-btn.active{
  background:var(--btn-bg); border-color:transparent;
  box-shadow:var(--glow-purple); transform:translateY(-2px);
}
.level-btn.completed::after{content:'✓'; margin-left:4px; color:var(--success); font-weight:800}

/* ============================================================
   GAME AREA
   ============================================================ */
.game-area{
  flex:1; display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:20px; gap:24px; overflow:hidden;
}
.tubes-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(38px,1fr));
  gap:12px 8px;
  max-width:720px; width:100%;
  justify-items:center; align-items:end;
}

/* ============================================================
   TUBE
   ============================================================ */
.tube{
  position:relative;
  width:42px; height:190px;
  background:var(--tube-bg);
  border:2px solid var(--tube-border);
  border-top:none;
  border-radius:0 0 21px 21px;
  box-shadow:var(--tube-shadow);
  display:flex; flex-direction:column-reverse; align-items:center;
  padding:4px 4px 0;
  cursor:pointer;
  transition:transform var(--t-base), filter var(--t-base), border-color var(--t-base);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  overflow:hidden;
}
.tube::before{
  content:''; position:absolute;
  top:0; left:4px; right:4px; height:8px;
  background:linear-gradient(to bottom,rgba(255,255,255,.3),transparent);
  border-radius:0 0 50% 50%;
  pointer-events:none; z-index:5;
  transition:background var(--t-base);
}
.tube:not(.complete):not(.selected):hover{transform:translateY(-3px)}
.tube.selected{transform:translateY(-12px); filter:drop-shadow(var(--glow-purple))}
.tube.destination{filter:drop-shadow(var(--glow-green))}
.tube.destination::before{background:linear-gradient(to bottom,rgba(74,222,128,.6),transparent)}
.tube.complete{border-color:var(--success); filter:drop-shadow(0 0 12px rgba(74,222,128,.5))}
.tube.complete::after{
  content:'✓';
  position:absolute; top:-14px; left:50%; transform:translateX(-50%);
  color:var(--success); font-size:14px; font-weight:800;
}
.tube.invalid{animation:shake .35s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}

/* ============================================================
   BALL
   ============================================================ */
.ball{
  width:32px; height:32px;
  border-radius:50%; margin-bottom:2px;
  position:relative;
  box-shadow:
    inset -3px -3px 8px rgba(0,0,0,.4),
    inset 3px 3px 8px rgba(255,255,255,.4),
    0 2px 6px rgba(0,0,0,.4);
  flex-shrink:0;
  transition:transform var(--t-base);
}
.ball::before{
  content:''; position:absolute;
  top:12%; left:18%; width:30%; height:30%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);
  pointer-events:none;
}
.ball.red{background:radial-gradient(circle at 35% 30%,#ff6b6b,#dc2626 60%,#991b1b)}
.ball.green{background:radial-gradient(circle at 35% 30%,#86efac,#22c55e 60%,#15803d)}
.ball.blue{background:radial-gradient(circle at 35% 30%,#93c5fd,#3b82f6 60%,#1e40af)}
.ball.yellow{background:radial-gradient(circle at 35% 30%,#fde68a,#eab308 60%,#a16207)}
.ball.purple{background:radial-gradient(circle at 35% 30%,#d8b4fe,#a855f7 60%,#6b21a8)}
.ball.orange{background:radial-gradient(circle at 35% 30%,#fdba74,#f97316 60%,#c2410c)}
.ball.pink{background:radial-gradient(circle at 35% 30%,#f9a8d4,#ec4899 60%,#9d174d)}
.ball.cyan{background:radial-gradient(circle at 35% 30%,#a5f3fc,#06b6d4 60%,#0e7490)}
.ball.brown{background:radial-gradient(circle at 35% 30%,#d6b896,#8b5a2b 60%,#5a3a17)}
.ball.gray{background:radial-gradient(circle at 35% 30%,#d4d4d8,#71717a 60%,#3f3f46)}
.ball.lime{background:radial-gradient(circle at 35% 30%,#d9f99d,#84cc16 60%,#3f6212)}

/* ============================================================
   BOTTOM BAR
   ============================================================ */
.bottom-bar{
  display:flex; justify-content:center; gap:12px;
  padding:20px; flex-wrap:wrap;
}
.btn{
  padding:12px 24px;
  border-radius:var(--radius-full);
  background:var(--btn-bg);
  color:#fff; font-size:14px; font-weight:700;
  display:inline-flex; align-items:center; gap:8px;
  transition:all var(--t-base);
  box-shadow:0 8px 24px rgba(168,85,247,.4);
}
.btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 12px 32px rgba(168,85,247,.55)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.secondary{background:var(--btn-accent); box-shadow:0 8px 24px rgba(59,130,246,.4)}
.btn.secondary:hover:not(:disabled){box-shadow:0 12px 32px rgba(59,130,246,.55)}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none!important; box-shadow:none!important}
.btn.full{width:100%; justify-content:center}

.zen-toggle{
  display:flex; align-items:center; gap:8px;
  font-size:12px; font-weight:600;
  color:var(--text-muted);
  padding:8px 16px;
  background:var(--surface);
  border-radius:var(--radius-full);
  cursor:pointer;
  border:1px solid var(--border);
  transition:all var(--t-base);
}
.zen-toggle:hover{background:var(--surface-hover)}
.zen-toggle.active{
  background:rgba(74,222,128,.2);
  border-color:rgba(74,222,128,.5);
  color:var(--success);
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:20px;
  opacity:0; pointer-events:none;
  transition:opacity var(--t-base);
}
.modal-overlay.active{opacity:1; pointer-events:auto}
.modal-card{
  background:linear-gradient(135deg,rgba(45,27,78,.98),rgba(26,11,46,.98));
  border:1px solid rgba(168,85,247,.4);
  border-radius:var(--radius-xl);
  padding:32px 24px;
  max-width:380px; width:100%;
  text-align:center;
  box-shadow:var(--shadow-lg),0 0 60px rgba(168,85,247,.3);
  transform:scale(.9);
  transition:transform var(--t-slow);
}
.modal-overlay.active .modal-card{transform:scale(1)}
[data-theme="light"] .modal-card{
  background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(245,240,255,.98));
  border:1px solid rgba(168,85,247,.3);
}
.modal-emoji{font-size:64px; margin-bottom:12px; line-height:1}
.modal-overlay.active .modal-emoji{animation:bounceIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes bounceIn{
  0%{transform:scale(0) rotate(-20deg)}
  60%{transform:scale(1.2) rotate(10deg)}
  100%{transform:scale(1) rotate(0)}
}
.modal-title{
  font-size:24px; font-weight:800; margin:0 0 8px;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
.modal-message{color:var(--text-muted); font-size:14px; margin:0 0 20px; line-height:1.5}
.modal-stats{
  display:flex; justify-content:space-around;
  padding:16px; background:rgba(168,85,247,.1);
  border-radius:var(--radius-md); margin-bottom:20px;
}
.modal-stat-value{font-size:22px; font-weight:800; color:var(--accent-1); font-variant-numeric:tabular-nums}
.modal-stat-label{font-size:11px; text-transform:uppercase; color:var(--text-muted); letter-spacing:1px}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container{
  position:fixed; top:80px; left:50%; transform:translateX(-50%);
  z-index:2000; display:flex; flex-direction:column;
  gap:8px; align-items:center; pointer-events:none;
}
.toast{
  color:#fff; padding:12px 20px;
  border-radius:var(--radius-full);
  font-weight:700; font-size:13px;
  box-shadow:var(--shadow-md);
  animation:toastIn .3s cubic-bezier(.16,1,.3,1);
  white-space:nowrap;
}
.toast.info{background:linear-gradient(135deg,var(--accent-1),var(--accent-2))}
.toast.warn{background:linear-gradient(135deg,var(--warning),#d97706)}
.toast.removing{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:600px){
  .tube{width:36px; height:160px}
  .ball{width:26px; height:26px}
  .tubes-container{gap:10px 6px}
  .game-area{padding:12px; gap:16px}
  .btn{padding:10px 18px; font-size:13px}
  .btn-icon{width:42px; height:42px; font-size:18px}
  .stat-value{font-size:17px}
}
@media (max-height:700px){
  .tube{height:140px}
  .game-area{gap:12px}
  .top-bar{padding:10px 16px}
  .bottom-bar{padding:12px}
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="top-bar">
  <div class="top-bar-actions">
    <button class="btn-icon" id="btn-theme" type="button" aria-label="Alternar tema" title="Tema">🌙</button>
    <button class="btn-icon" id="btn-sound" type="button" aria-label="Alternar som" title="Som">🔊</button>
  </div>
  <div class="stats" role="status" aria-live="polite">
    <div class="stat">
      <div class="stat-value" id="stat-moves">0</div>
      <div class="stat-label">Movimentos</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-level">1</div>
      <div class="stat-label">Nível</div>
    </div>
  </div>
  <button class="btn-icon" id="btn-restart" type="button" aria-label="Reiniciar nível" title="Reiniciar">🔄</button>
</header>

<!-- ============ LEVEL SELECTOR ============ -->
<nav class="level-selector" id="level-selector" aria-label="Seleção de nível"></nav>

<!-- ============ GAME AREA ============ -->
<main class="game-area">
  <div class="tubes-container" id="tubes-container" role="grid" aria-label="Tabuleiro"></div>
</main>

<!-- ============ BOTTOM BAR ============ -->
<footer class="bottom-bar">
  <button class="btn secondary" id="btn-undo" type="button" disabled>↶ Desfazer</button>
  <button class="btn secondary" id="btn-hint" type="button">💡 Dica</button>
  <button class="btn secondary" id="btn-add-tube" type="button">➕ Tubo Extra</button>
  <button class="zen-toggle" id="btn-zen" type="button" aria-pressed="false">🧘 Zen</button>
</footer>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-emoji">🎉</div>
    <h2 class="modal-title" id="modal-title">Nível Completo!</h2>
    <p class="modal-message">Parabéns! Conseguiste ordenar todas as bolas.</p>
    <div class="modal-stats">
      <div>
        <div class="modal-stat-value" id="modal-moves">0</div>
        <div class="modal-stat-label">Movimentos</div>
      </div>
      <div>
        <div class="modal-stat-value" id="modal-level">1</div>
        <div class="modal-stat-label">Nível</div>
      </div>
    </div>
    <button class="btn full" id="btn-next-level" type="button">▶️ Próximo Nível</button>
  </div>
</div>

<!-- ============ TOASTS ============ -->
<div class="toast-container" id="toast-container" aria-live="polite"></div>

<script>
/* ============================================================
   BALL SORT PUZZLE v4 — Professional Edition
   Architecture: Modular, event-driven, testable, persistent
   ============================================================ */
'use strict';

const CONFIG = Object.freeze({
  COLORS: ['red','green','blue','yellow','purple','orange','pink','cyan','brown','gray','lime'],
  BALLS_PER_TUBE: 4,
  MAX_LEVEL: 12,
  MAX_EXTRA_TUBES: 2,
  MAX_HISTORY: 100,
  TOAST_DURATION: 1800,
  WIN_MODAL_DELAY: 400,
  STORAGE_KEYS: Object.freeze({
    THEME: 'ballsort.theme',
    LEVEL: 'ballsort.level',
    COMPLETED: 'ballsort.completed',
    SAVE: 'ballsort.save',
    SOUND: 'ballsort.sound'
  })
});

/* ============================================================
   EVENT BUS
   ============================================================ */
const EventBus = (() => {
  const listeners = new Map();
  return {
    on(event, handler) {
      if (!listeners.has(event)) listeners.set(event, new Set());
      listeners.get(event).add(handler);
      return () => listeners.get(event).delete(handler);
    },
    emit(event, payload) {
      const set = listeners.get(event);
      if (!set) return;
      set.forEach(fn => { try { fn(payload); } catch (e) { console.error(e); } });
    }
  };
})();

/* ============================================================
   STORAGE
   ============================================================ */
const Storage = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : raw;
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, String(value)); } catch {}
  },
  getJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  setJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch {}
  }
};

/* ============================================================
   AUDIO — com toggle global
   ============================================================ */
const Sound = (() => {
  let ctx = null;
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.SOUND, '1') === '1';

  const ensure = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  };

  const tone = (freq, type, duration, volume) => {
    if (!enabled) return;
    const ac = ensure(); if (!ac) return;
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(now); osc.stop(now + duration);
  };

  return {
    isEnabled: () => enabled,
    toggle() {
      enabled = !enabled;
      Storage.set(CONFIG.STORAGE_KEYS.SOUND, enabled ? '1' : '0');
      if (enabled) tone(880, 'sine', .1, .1);
      return enabled;
    },
    select() { tone(600, 'sine', .08, .06); },
    move() { tone(400, 'triangle', .12, .08); },
    invalid() { tone(180, 'sawtooth', .15, .06); },
    win() {
      if (!enabled) return;
      const ac = ensure(); if (!ac) return;
      const now = ac.currentTime;
      [523, 659, 784, 1046].forEach((freq, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = freq; o.type = 'sine';
        const t = now + i * .1;
        g.gain.setValueAtTime(.001, t);
        g.gain.exponentialRampToValueAtTime(.12, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + .35);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + .35);
      });
    }
  };
})();

/* ============================================================
   TOASTER
   ============================================================ */
const Toaster = (() => {
  const container = document.getElementById('toast-container');
  const queue = [];
  let active = false;

  const show = ({ msg, type }) => {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.classList.add('removing');
      setTimeout(() => {
        el.remove();
        active = false;
        next();
      }, 300);
    }, CONFIG.TOAST_DURATION);
  };

  const next = () => {
    if (active || queue.length === 0) return;
    active = true;
    show(queue.shift());
  };

  return {
    info(msg) { queue.push({ msg, type: 'info' }); next(); },
    warn(msg) { queue.push({ msg, type: 'warn' }); next(); }
  };
})();

/* ============================================================
   LEVEL GENERATOR — corrigido
   ============================================================ */
const LevelGenerator = (() => {
  const isSolved = (tubes) => tubes.every(t =>
    t.length === 0 || (t.length === CONFIG.BALLS_PER_TUBE && t.every(c => c === t[0]))
  );

  const config = (level) => {
    const numColors = Math.min(3 + Math.floor((level - 1) / 2), 8);
    const emptyTubes = level <= 2 ? 2 : 1;
    return { numColors, emptyTubes };
  };

  /**
   * Movimentos reversos válidos — com bloqueio correto do inverso direto.
   */
  const validReverseMoves = (tubes, last) => {
    const moves = [];
    for (let from = 0; from < tubes.length; from++) {
      if (tubes[from].length === 0) continue;
      const color = tubes[from][tubes[from].length - 1];
      for (let to = 0; to < tubes.length; to++) {
        if (from === to) continue;
        if (tubes[to].length >= CONFIG.BALLS_PER_TUBE) continue;
        if (tubes[to].length > 0 && tubes[to][tubes[to].length - 1] !== color) continue;
        // Bloquear inverso direto: se último move foi (to → from), bloqueia (from → to)
        if (last && last.from === to && last.to === from) continue;
        moves.push({ from, to });
      }
    }
    return moves;
  };

  const shuffleBalls = (tubes) => {
    const allBalls = tubes.flat();
    for (let i = allBalls.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allBalls[i], allBalls[j]] = [allBalls[j], allBalls[i]];
    }
    const result = [];
    const numFullTubes = allBalls.length / CONFIG.BALLS_PER_TUBE;
    for (let i = 0; i < numFullTubes; i++) {
      result.push(allBalls.slice(i * CONFIG.BALLS_PER_TUBE, (i + 1) * CONFIG.BALLS_PER_TUBE));
    }
    return result;
  };

  const generate = (level) => {
    const { numColors, emptyTubes } = config(level);
    const colors = CONFIG.COLORS.slice(0, numColors);
    const full = colors.map(c => Array(CONFIG.BALLS_PER_TUBE).fill(c));
    const empty = Array.from({ length: emptyTubes }, () => []);
    let tubes = [...shuffleBalls(full), ...empty];

    const steps = numColors * 8 + level * 4;
    let last = null;
    let stuck = 0;
    for (let i = 0; i < steps; i++) {
      const moves = validReverseMoves(tubes, last);
      if (moves.length === 0) {
        stuck++;
        if (stuck > 3) break;
        continue;
      }
      stuck = 0;
      const m = moves[Math.floor(Math.random() * moves.length)];
      tubes[m.to].push(tubes[m.from].pop());
      last = m;
    }

    if (isSolved(tubes)) return generate(level);
    return tubes;
  };

  return { generate, config, isSolved };
})();

/* ============================================================
   RULES
   ============================================================ */
const Rules = {
  isComplete(tube) {
    return tube.length === CONFIG.BALLS_PER_TUBE && tube.every(c => c === tube[0]);
  },
  top(tube) {
    return tube.length ? tube[tube.length - 1] : null;
  },
  canPlace(dest, color) {
    if (dest.length >= CONFIG.BALLS_PER_TUBE) return false;
    if (dest.length === 0) return true;
    return Rules.top(dest) === color;
  },
  allSolved(tubes) {
    return tubes.every(t => t.length === 0 || Rules.isComplete(t));
  },
  hasAnyBall(tubes) {
    return tubes.some(t => t.length > 0);
  },
  hasAnyMove(tubes) {
    for (let from = 0; from < tubes.length; from++) {
      const src = tubes[from];
      if (src.length === 0 || Rules.isComplete(src)) continue;
      const color = Rules.top(src);
      for (let to = 0; to < tubes.length; to++) {
        if (from === to) continue;
        if (Rules.canPlace(tubes[to], color)) return true;
      }
    }
    return false;
  }
};

/* ============================================================
   GAME STATE
   ============================================================ */
class GameState {
  constructor() {
    this.level = 1;
    this.moves = 0;
    this.tubes = [];
    this.extraTubes = 0;
    this.selected = null;
    this.history = [];
    this.zenMode = false;
    this.completed = false;
    this.completedLevels = Storage.getJSON(CONFIG.STORAGE_KEYS.COMPLETED, []) || [];
    this.theme = Storage.get(CONFIG.STORAGE_KEYS.THEME, 'dark');
  }

  snapshot() {
    return {
      tubes: this.tubes.map(t => t.slice()),
      moves: this.moves,
      selected: this.selected,
      extraTubes: this.extraTubes,
      completed: this.completed
    };
  }

  pushHistory() {
    this.history.push(this.snapshot());
    if (this.history.length > CONFIG.MAX_HISTORY) this.history.shift();
  }

  popHistory() {
    const snap = this.history.pop();
    if (!snap) return false;
    this.tubes = snap.tubes.map(t => t.slice());
    this.moves = snap.moves;
    this.selected = null;
    this.extraTubes = snap.extraTubes;
    this.completed = false;
    return true;
  }

  markCompleted(level) {
    if (!this.completedLevels.includes(level)) {
      this.completedLevels.push(level);
      Storage.setJSON(CONFIG.STORAGE_KEYS.COMPLETED, this.completedLevels);
    }
  }

  saveLevel() {
    Storage.set(CONFIG.STORAGE_KEYS.LEVEL, this.level);
  }

  saveGame() {
    Storage.setJSON(CONFIG.STORAGE_KEYS.SAVE, {
      level: this.level,
      moves: this.moves,
      tubes: this.tubes,
      extraTubes: this.extraTubes,
      history: this.history.slice(-20)
    });
  }

  loadSavedGame() {
    const save = Storage.getJSON(CONFIG.STORAGE_KEYS.SAVE, null);
    if (!save || !Array.isArray(save.tubes) || save.tubes.length === 0) return false;
    this.level = save.level || 1;
    this.moves = save.moves || 0;
    this.tubes = save.tubes;
    this.extraTubes = save.extraTubes || 0;
    this.history = save.history || [];
    this.selected = null;
    this.completed = false;
    return true;
  }

  clearSave() {
    Storage.remove(CONFIG.STORAGE_KEYS.SAVE);
  }
}

/* ============================================================
   GAME CONTROLLER
   ============================================================ */
class GameController {
  constructor(state) {
    this.state = state;
  }

  loadLevel(level, { silent = false } = {}) {
    this.state.level = level;
    this.state.moves = 0;
    this.state.tubes = LevelGenerator.generate(level);
    this.state.extraTubes = 0;
    this.state.selected = null;
    this.state.history = [];
    this.state.completed = false;
    if (!silent) {
      this.state.saveLevel();
      this.state.saveGame();
    }
    EventBus.emit('state:changed');
    EventBus.emit('level:loaded', level);
  }

  restart() {
    this.loadLevel(this.state.level, { silent: true });
    EventBus.emit('toast:info', 'Nível reiniciado');
  }

  selectTube(idx) {
    if (this.state.completed) return;
    const state = this.state;

    if (state.selected === idx) {
      state.selected = null;
      EventBus.emit('state:changed');
      return;
    }

    if (state.selected !== null) {
      const moved = this.tryMove(state.selected, idx);
      if (moved) return;
      const target = state.tubes[idx];
      if (target.length > 0 && !Rules.isComplete(target)) {
        state.selected = idx;
        Sound.select();
      } else {
        state.selected = null;
        EventBus.emit('tube:invalid', idx);
      }
      EventBus.emit('state:changed');
      return;
    }

    const tube = state.tubes[idx];
    if (tube.length === 0 || Rules.isComplete(tube)) {
      EventBus.emit('tube:invalid', idx);
      return;
    }
    state.selected = idx;
    Sound.select();
    EventBus.emit('state:changed');
  }

  tryMove(fromIdx, toIdx) {
    const state = this.state;
    const from = state.tubes[fromIdx];
    const to = state.tubes[toIdx];

    if (Rules.isComplete(from)) {
      EventBus.emit('toast:warn', 'Este tubo já está completo');
      state.selected = null;
      EventBus.emit('state:changed');
      return false;
    }
    if (from.length === 0) {
      state.selected = null;
      EventBus.emit('state:changed');
      return false;
    }

    const color = Rules.top(from);
    if (!Rules.canPlace(to, color)) {
      Sound.invalid();
      EventBus.emit('tube:invalid', toIdx);
      return false;
    }

    state.pushHistory();

    let count = 0;
    while (from.length > 0 && Rules.top(from) === color && Rules.canPlace(to, color)) {
      to.push(from.pop());
      count++;
    }

    if (count > 0) {
      state.moves++;
      Sound.move();
      EventBus.emit('ball:moved', { count });
    }
    state.selected = null;
    this.checkWin();
    state.saveGame();

    // Detectar "sem movimentos possíveis"
    setTimeout(() => {
      if (!state.completed && Rules.hasAnyBall(state.tubes) && !Rules.hasAnyMove(state.tubes)) {
        EventBus.emit('game:stuck');
      }
    }, 100);

    EventBus.emit('state:changed');
    return true;
  }

  checkWin() {
    const state = this.state;
    if (!Rules.allSolved(state.tubes) || !Rules.hasAnyBall(state.tubes)) return;

    state.completed = true;
    state.markCompleted(state.level);
    state.clearSave();
    Sound.win();
    EventBus.emit('level:won', { level: state.level, moves: state.moves });
  }

  undo() {
    if (this.state.history.length === 0) {
      EventBus.emit('toast:info', 'Nada para desfazer');
      return;
    }
    this.state.popHistory();
    EventBus.emit('modal:close');
    Sound.select();
    this.state.saveGame();
    EventBus.emit('state:changed');
  }

  addExtraTube() {
    const state = this.state;
    if (state.extraTubes >= CONFIG.MAX_EXTRA_TUBES) {
      EventBus.emit('toast:warn', `Máximo de ${CONFIG.MAX_EXTRA_TUBES} tubos extras`);
      return;
    }
    state.pushHistory();
    state.tubes.push([]);
    state.extraTubes++;
    Sound.select();
    state.saveGame();
    EventBus.emit('state:changed');
  }

  toggleZen() {
    this.state.zenMode = !this.state.zenMode;
    EventBus.emit('zen:toggled', this.state.zenMode);
    EventBus.emit('toast:info', this.state.zenMode ? '🧘 Modo Zen ativado' : 'Modo Zen desativado');
  }

  hint() {
    const tubes = this.state.tubes;
    // Prioridade 1: mover para tubo não-vazio (junta grupos)
    // Prioridade 2: mover para tubo vazio
    const empties = [];
    const nonEmpties = [];

    for (let from = 0; from < tubes.length; from++) {
      const src = tubes[from];
      if (src.length === 0 || Rules.isComplete(src)) continue;
      const color = Rules.top(src);
      for (let to = 0; to < tubes.length; to++) {
        if (from === to) continue;
        if (!Rules.canPlace(tubes[to], color)) continue;
        if (tubes[to].length === 0) empties.push({ from, to });
        else nonEmpties.push({ from, to });
      }
    }

    const pick = nonEmpties[0] || empties[0];
    if (pick) {
      EventBus.emit('hint:show', pick);
    } else {
      EventBus.emit('toast:warn', 'Sem movimentos disponíveis');
    }
  }

  nextLevel() {
    const next = Math.min(this.state.level + 1, CONFIG.MAX_LEVEL);
    this.loadLevel(next);
  }
}

/* ============================================================
   RENDERER
   ============================================================ */
class Renderer {
  constructor(state) {
    this.state = state;
    this.tubesEl = document.getElementById('tubes-container');
    this.levelSelectorEl = document.getElementById('level-selector');
    this.statsEls = {
      moves: document.getElementById('stat-moves'),
      level: document.getElementById('stat-level')
    };
    this.btnUndo = document.getElementById('btn-undo');
    this.btnAddTube = document.getElementById('btn-add-tube');
    this.btnZen = document.getElementById('btn-zen');
    this.btnTheme = document.getElementById('btn-theme');
    this.btnSound = document.getElementById('btn-sound');
    this.modal = document.getElementById('modal-overlay');
    this.onTubeClick = null;
  }

  bindTubeClick(handler) { this.onTubeClick = handler; }

  render() {
    this.renderTubes();
    this.renderStats();
    this.renderControls();
    this.renderLevelSelector();
    this.renderTheme();
  }

  renderTubes() {
    const s = this.state;
    const frag = document.createDocumentFragment();

    s.tubes.forEach((tube, idx) => {
      const el = document.createElement('div');
      el.className = 'tube';
      el.dataset.index = idx;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `Tubo ${idx + 1}`);

      if (s.selected === idx) el.classList.add('selected');
      if (Rules.isComplete(tube)) el.classList.add('complete');

      if (s.selected !== null && s.selected !== idx) {
        const origin = s.tubes[s.selected];
        if (origin.length > 0 && !Rules.isComplete(origin)) {
          const color = Rules.top(origin);
          if (Rules.canPlace(tube, color)) el.classList.add('destination');
        }
      }

      tube.forEach(color => {
        const ball = document.createElement('div');
        ball.className = `ball ${color}`;
        el.appendChild(ball);
      });

      el.addEventListener('click', () => this.onTubeClick && this.onTubeClick(idx));
      el.tabIndex = 0;
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.onTubeClick && this.onTubeClick(idx);
        }
      });

      frag.appendChild(el);
    });

    this.tubesEl.innerHTML = '';
    this.tubesEl.appendChild(frag);
  }

  renderStats() {
    this.statsEls.moves.textContent = this.state.moves;
    this.statsEls.level.textContent = this.state.level;
  }

  renderControls() {
    this.btnUndo.disabled = this.state.history.length === 0;
    this.btnAddTube.disabled = this.state.extraTubes >= CONFIG.MAX_EXTRA_TUBES;
    this.btnZen.classList.toggle('active', this.state.zenMode);
    this.btnZen.setAttribute('aria-pressed', String(this.state.zenMode));
    if (this.btnSound) {
      this.btnSound.textContent = Sound.isEnabled() ? '🔊' : '🔇';
    }
  }

  renderLevelSelector() {
    const s = this.state;
    if (this.levelSelectorEl.children.length !== CONFIG.MAX_LEVEL) {
      this.levelSelectorEl.innerHTML = '';
      for (let i = 1; i <= CONFIG.MAX_LEVEL; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'level-btn';
        btn.textContent = i;
        btn.dataset.level = i;
        this.levelSelectorEl.appendChild(btn);
      }
    }
    Array.from(this.levelSelectorEl.children).forEach(btn => {
      const lvl = Number(btn.dataset.level);
      btn.classList.toggle('active', lvl === s.level);
      btn.classList.toggle('completed', s.completedLevels.includes(lvl));
    });
  }

  renderTheme() {
    document.documentElement.setAttribute('data-theme', this.state.theme);
    this.btnTheme.textContent = this.state.theme === 'dark' ? '🌙' : '☀️';
  }

  flashInvalid(idx) {
    const el = this.tubesEl.children[idx];
    if (!el) return;
    el.classList.remove('invalid');
    void el.offsetWidth;
    el.classList.add('invalid');
    setTimeout(() => el.classList.remove('invalid'), 400);
  }

  flashHint(from, to) {
    [from, to].forEach(i => {
      const el = this.tubesEl.children[i];
      if (!el) return;
      el.style.transition = 'filter .3s';
      el.style.filter = 'drop-shadow(0 0 16px #fbbf24)';
      setTimeout(() => { el.style.filter = ''; }, 1200);
    });
  }

  openModal({ level, moves }) {
    document.getElementById('modal-moves').textContent = moves;
    document.getElementById('modal-level').textContent = level;
    this.modal.classList.add('active');
  }

  closeModal() {
    this.modal.classList.remove('active');
  }

  toggleTheme() {
    this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
    Storage.set(CONFIG.STORAGE_KEYS.THEME, this.state.theme);
    this.renderTheme();
  }
}

/* ============================================================
   APP BOOTSTRAP
   ============================================================ */
(function App() {
  const state = new GameState();
  const controller = new GameController(state);
  const renderer = new Renderer(state);

  renderer.bindTubeClick(idx => controller.selectTube(idx));

  EventBus.on('state:changed', () => renderer.render());
  EventBus.on('tube:invalid', idx => renderer.flashInvalid(idx));
  EventBus.on('toast:info', msg => Toaster.info(msg));
  EventBus.on('toast:warn', msg => Toaster.warn(msg));
  EventBus.on('modal:close', () => renderer.closeModal());
  EventBus.on('hint:show', ({ from, to }) => renderer.flashHint(from, to));
  EventBus.on('level:won', ({ level, moves }) => {
    setTimeout(() => renderer.openModal({ level, moves }), CONFIG.WIN_MODAL_DELAY);
  });
  EventBus.on('game:stuck', () => {
    if (!state.zenMode) Toaster.warn('Sem movimentos! Tenta desfazer ↶');
  });

  // Level selector
  document.getElementById('level-selector').addEventListener('click', (e) => {
    const btn = e.target.closest('.level-btn');
    if (!btn) return;
    controller.loadLevel(Number(btn.dataset.level));
  });

  // Controles
  document.getElementById('btn-undo').addEventListener('click', () => controller.undo());
  document.getElementById('btn-add-tube').addEventListener('click', () => controller.addExtraTube());
  document.getElementById('btn-zen').addEventListener('click', () => controller.toggleZen());
  document.getElementById('btn-theme').addEventListener('click', () => renderer.toggleTheme());
  document.getElementById('btn-restart').addEventListener('click', () => controller.restart());
  document.getElementById('btn-sound').addEventListener('click', () => {
    Sound.toggle();
    renderer.renderControls();
  });
  document.getElementById('btn-hint').addEventListener('click', () => controller.hint());

  document.getElementById('btn-next-level').addEventListener('click', () => {
    renderer.closeModal();
    controller.nextLevel();
  });

  // Atalhos de teclado
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    const isUndo = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z';
    if (isUndo) { e.preventDefault(); controller.undo(); }
    else if (e.key.toLowerCase() === 'r') controller.restart();
    else if (e.key.toLowerCase() === 't') controller.addExtraTube();
    else if (e.key.toLowerCase() === 'h') controller.hint();
    else if (e.key === 'Escape') {
      if (state.selected !== null) {
        state.selected = null;
        EventBus.emit('state:changed');
      } else {
        renderer.closeModal();
      }
    }
  });

  // Boot
  renderer.renderTheme();

  // Tentar restaurar partida salva, senão carregar último nível
  const restored = state.loadSavedGame();
  if (!restored) {
    const savedLevel = Math.max(1, Math.min(
      CONFIG.MAX_LEVEL,
      parseInt(Storage.get(CONFIG.STORAGE_KEYS.LEVEL, '1'), 10) || 1
    ));
    controller.loadLevel(savedLevel);
  } else {
    EventBus.emit('state:changed');
    Toaster.info(`Partida restaurada · Nível ${state.level}`);
  }
})();
</script>
